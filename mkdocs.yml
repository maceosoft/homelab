site_name: HomeLab — K3s + Incus + CAPN
site_description: Documentación de un HomeLab híbrido x86_64 + ARM64 (Incus, K3s, CAPN, ArgoCD)
site_url: https://homelab.symintelligent.com/
repo_url: https://github.com/symintel/homelab
repo_name: symintel/homelab
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - content.tooltips

# Enlace del pie para volver a abrir el aviso de cookies (Material lo reconoce por #__consent).
copyright: <a href="/privacidad/">Política de privacidad</a> · <a href="#__consent">Cambiar preferencias de cookies</a>

extra_css:
  - stylesheets/extra.css

# ai-tutor.js: botón "Aprende con IA" en cada paso. Es la fuente única del enlace del cuaderno de NotebookLM
# (NOTEBOOK_URL, al inicio del archivo): el botón de aprende.md lo toma de ahí.
# external-links.js: abre en una pestaña nueva todo enlace que apunta fuera de este sitio.
extra_javascript:
  - javascripts/ai-tutor.js
  - javascripts/external-links.js

# Google Analytics (gtag.js). Material genera el snippet por su cuenta a partir de esta opción.
extra:
  analytics:
    provider: google
    property: G-TD9S6WB8E2
  # Aviso de consentimiento: Analytics no se carga hasta que el visitante acepte.
  # La clave de "cookies" debe llamarse "analytics" para que Material la enlace con el proveedor.
  consent:
    title: Cookies y privacidad
    description: >-
      Usamos cookies para medir cómo se usa esta documentación (Google Analytics) y así
      mejorarla, y para mostrar los datos del repositorio en GitHub. Solo se activan si las
      aceptas; puedes cambiar tu decisión en cualquier momento desde el pie de página.
      Detalle en la <a href="/privacidad/">política de privacidad</a>.
    cookies:
      analytics: Google Analytics
    actions:
      - accept
      - reject
      - manage

markdown_extensions:
  - admonition
  # Siglas: tooltip automático en todas las páginas (includes/abbreviations.md)
  - abbr
  - attr_list
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Listas "- [ ]" / "- [x]" como casillas (checklists de las fases).
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: es
  # llms.txt y llms-full.txt: toda la documentación en texto plano para IA (NotebookLM, ChatGPT, Gemini,
  # Claude…). Se publican en la raíz del sitio. Ver docs/aprende.md.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Documentación en español de un HomeLab híbrido (x86_64 + ARM64) con Incus, K3s, Argo CD (GitOps),
        Calico, MetalLB, Gateway API y Longhorn. Está pensada para quien empieza y para quien ya sabe:
        cada fase explica qué hacer, por qué y cómo verificarlo.
      sections:
        Inicio y glosario:
          - index.md
          - aprende.md
          - glosario.md
        Guía de implementación (Fases 0 a 6):
          - implementacion/*.md
        Operación (procedimientos de rutina):
          - operacion/*.md
        Arquitectura, plataforma y referencia:
          - architecture/*.md
          - hardware/*.md
          - networking/*.md
          - incus/*.md
          - k3s/*.md
          - gitops/*.md
          - storage/*.md
          - secrets/*.md
          - symintel/*.md
          - vcluster/*.md
          - capn/*.md
          - ansible/*.md
          - security/*.md
          - labs/cinc/*.md

# Muchas páginas enlazan deliberadamente a fuentes fuera de docs_dir
# (ansible/, repo symintel/gitops) en vez de duplicar su contenido aquí.
# MkDocs no puede validar esos archivos por estar fuera de docs/,
# así que se bajan a "info" para no romper `mkdocs build --strict`.
validation:
  links:
    not_found: info

# Recargar mkdocs serve al editar el glosario
watch:
  - includes

nav:
  - Empieza aquí:
      - Inicio: index.md
      - Aprende con IA (gratis): aprende.md
  - Implementación:
      - Visión general: implementacion/index.md
      - "Fase 0 — Preparación": implementacion/fase-0-preparacion.md
      - "Fase 1 — Red": implementacion/fase-1-red.md
      - "Fase 2 — Incus": implementacion/fase-2-incus.md
      - "Fase 3 — K3s": implementacion/fase-3-k3s.md
      - "Fase 4 — GitOps": implementacion/fase-4-gitops.md
      - "Fase 5 — vCluster": implementacion/fase-5-vcluster.md
      - "Fase 6 — CAPN": implementacion/fase-6-capn.md
      - Resumen del HomeLab: implementacion/resumen-homelab.md
      - Stack tecnológico: implementacion/stack-tecnologico.md
      - Apéndice — Desinstalar K3s: implementacion/apendice-desinstalar.md
  - Operación:
      - Procedimientos de rutina: operacion/index.md
      - URLs y accesos de los productos: operacion/urls-y-accesos.md
      - Entrar por SSH a los servidores: operacion/acceso-ssh.md
      - Monitoreo y alertas: operacion/monitoreo.md
      - Agregar un repo: operacion/agregar-repo.md
      - Agregar un nodo: operacion/agregar-nodo.md
      - Sacar o reemplazar un nodo: operacion/sacar-nodo.md
      - Agregar un disco a un nodo: operacion/agregar-disco.md
      - Backups y snapshots de Incus: operacion/backups-incus.md
      - Actualizar K3s: operacion/actualizar-k3s.md
      - Actualizar ArgoCD: operacion/actualizar-argocd.md
      - Cambiar el controlador de Gateway: operacion/cambiar-gateway.md
      - Caché de los runners (ARC): operacion/cache-arc.md
      - Calico (CNI) con ArgoCD: operacion/actualizar-calico.md
      - Actualizar Debian en deborah (12 a 13): operacion/actualizar-debian-deborah.md
      - Rotar credenciales: operacion/rotar-credenciales.md
      - Pipeline de gitops: operacion/pipeline-gitops.md
  - Arquitectura:
      - "Overview + C4 (Nivel 1-2)": architecture/overview.md
      - "Nivel 3 — Componentes": architecture/nivel-3-componentes.md
      - "Nivel 4 — Despliegue": architecture/nivel-4-despliegue.md
  - Referencia técnica:
      - Hardware:
          - Inventario: hardware/inventory.md
          - Discovery (Ansible): hardware/discovery.md
      - Red: networking/index.md
      - Incus:
          - Clúster: incus/cluster-setup.md
      - K3s:
          - Instalación manual: k3s/index.md
          - Opciones del playbook: k3s/playbook-options.md
      - Ansible:
          - Catálogo de roles: ansible/index.md
      - GitOps:
          - Catálogo y troubleshooting: gitops/index.md
          - vCluster Platform: vcluster/index.md
      - CAPN: capn/index.md
      - Storage: storage/index.md
      - Secretos: secrets/index.md
      - "Plataforma symintel — GitHub": symintel/github.md
      - "Plataforma symintel — Discord y healthchecks.io": symintel/discord-healthchecks.md
      - Glosario: glosario.md
      - Seguridad:
          - Hardening post-incidente: security/hardening-post-incidente.md
  - Labs:
      - Cinc/Chef: labs/cinc/index.md
  - Privacidad: privacidad.md
