site_name: HomeLab — K3s + Incus + CAPN
site_description: Documentación de un HomeLab híbrido x86_64 + ARM64 (Incus, K3s, CAPN, Argo CD)
site_url: https://homelab.maceo.cl/
repo_url: https://github.com/maceosoft/homelab
repo_name: maceosoft/homelab
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - content.tooltips

# Enlace del pie para volver a abrir el aviso de cookies (Material lo reconoce por #__consent).
copyright: <a href="/privacidad/">Política de privacidad</a> · <a href="#__consent">Cambiar preferencias de cookies</a>

extra_css:
  - stylesheets/extra.css

# ai-tutor.js: botón "Aprende con IA" en cada paso. Es la fuente única del enlace del cuaderno de NotebookLM
# (NOTEBOOK_URL, al inicio del archivo): el botón de aprende.md lo toma de ahí.
# external-links.js: abre en una pestaña nueva todo enlace que apunta fuera de este sitio.
extra_javascript:
  - javascripts/ai-tutor.js
  - javascripts/external-links.js

# Google Analytics (gtag.js). Material genera el snippet por su cuenta a partir de esta opción.
extra:
  analytics:
    provider: google
    property: G-TD9S6WB8E2
  # Aviso de consentimiento: Analytics no se carga hasta que el visitante acepte.
  # La clave de "cookies" debe llamarse "analytics" para que Material la enlace con el proveedor.
  consent:
    title: Cookies y privacidad
    description: >-
      Usamos cookies para medir cómo se usa esta documentación (Google Analytics) y así
      mejorarla, y para mostrar los datos del repositorio en GitHub. Solo se activan si las
      aceptas; puedes cambiar tu decisión en cualquier momento desde el pie de página.
      Detalle en la <a href="/privacidad/">política de privacidad</a>.
    cookies:
      analytics: Google Analytics
    actions:
      - accept
      - reject
      - manage

markdown_extensions:
  - admonition
  # Siglas: tooltip automático en todas las páginas (includes/abbreviations.md, ver hooks/i18n.py)
  - abbr
  - attr_list
  # Las siglas se agregan por idioma desde hooks/i18n.py (no con auto_append, que es global).
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Listas "- [ ]" / "- [x]" como casillas (checklists de las fases).
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  # lang lo fija mkdocs-static-i18n por idioma (es/en).
  - search
  # Español es el original; las traducciones al inglés (*.en.md) las genera translate_docs.py.
  # Una página sin .en.md cae al español (fallback_to_default).
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true   # selector de idioma en el header + <link rel=alternate>
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: HomeLab — K3s + Incus + CAPN
          site_description: Documentation for a hybrid x86_64 + ARM64 HomeLab (Incus, K3s, CAPN, Argo CD)
          copyright: <a href="/en/privacidad/">Privacy policy</a> · <a href="#__consent">Change cookie preferences</a>
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: indigo
                accent: purple
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: indigo
                accent: purple
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
          nav_translations:
            Empieza aquí: Start here
            Inicio: Home
            Aprende con IA (gratis): Learn with AI (free)
            Implementación: Implementation
            Visión general: Overview
            Fase 0 — Preparación: Phase 0 — Preparation
            Fase 1 — Red: Phase 1 — Network
            Fase 2 — Incus: Phase 2 — Incus
            Fase 3 — K3s: Phase 3 — K3s
            Fase 4 — GitOps: Phase 4 — GitOps
            Fase 5 — vCluster: Phase 5 — vCluster
            Fase 6 — CAPN: Phase 6 — CAPN
            Resumen del HomeLab: HomeLab summary
            Stack tecnológico: Technology stack
            Apéndice — Desinstalar K3s: Appendix — Uninstall K3s
            Operación: Operations
            Procedimientos de rutina: Routine procedures
            URLs y accesos de los productos: Product URLs and access
            Entrar por SSH a los servidores: SSH into the servers
            Monitoreo y alertas: Monitoring and alerts
            Agregar un repo: Add a repo
            Agregar un nodo: Add a node
            Agregar un nodo de Ollama: Add an Ollama node
            Mover el control plane: Move the control plane
            Sacar o reemplazar un nodo: Remove or replace a node
            Agregar un disco a un nodo: Add a disk to a node
            Backups y snapshots de Incus: Incus backups and snapshots
            Parchear los nodos: Patch the nodes
            Actualizar K3s: Upgrade K3s
            Actualizar Argo CD: Upgrade Argo CD
            Cambiar el controlador de Gateway: Change the Gateway controller
            Caché de los runners (ARC): Runner cache (ARC)
            Calico (CNI) con Argo CD: Calico (CNI) with Argo CD
            Actualizar Debian en deborah (12 a 13): Upgrade Debian on deborah (12 to 13)
            Salud de los discos y del DNS: Disk and DNS health
            Certificado de métricas de Incus: Incus metrics certificate
            Avisos de versiones nuevas (Renovate): New-version notices (Renovate)
            Rotar credenciales: Rotate credentials
            Pipeline de gitops: GitOps pipeline
            Logs centralizados y reportes con IA: Centralized logs and AI reports
            Asistente de IA local (Ollama): Local AI assistant (Ollama)
            Arquitectura: Architecture
            Overview + C4 (Nivel 1-2): Overview + C4 (Level 1-2)
            Nivel 3 — Componentes: Level 3 — Components
            Nivel 4 — Despliegue: Level 4 — Deployment
            Particiones de las VMs de CAPN: CAPN VM partitioning
            Referencia técnica: Technical reference
            Inventario: Inventory
            Red: Network
            Clúster: Cluster
            Instalación manual: Manual installation
            Opciones del playbook: Playbook options
            Catálogo de roles: Role catalog
            Catálogo y troubleshooting: Catalog and troubleshooting
            Secretos: Secrets
            Plataforma maceosoft — GitHub: maceosoft platform — GitHub
            Plataforma maceosoft — Discord y healthchecks.io: maceosoft platform — Discord and healthchecks.io
            Glosario: Glossary
            Seguridad: Security
            Modelo de autenticación: Authentication model
            Hardening post-incidente: Post-incident hardening
            Privacidad: Privacy
  # llms.txt y llms-full.txt: toda la documentación en texto plano para IA (NotebookLM, ChatGPT, Gemini,
  # Claude…). Se publican en la raíz del sitio. Ver docs/aprende.md.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Documentación en español de un HomeLab híbrido (x86_64 + ARM64) con Incus, K3s, Argo CD (GitOps),
        Calico, MetalLB, Gateway API y Longhorn. Está pensada para quien empieza y para quien ya sabe:
        cada fase explica qué hacer, por qué y cómo verificarlo.
      sections:
        Inicio y glosario:
          - index.md
          - aprende.md
          - glosario.md
        Guía de implementación (Fases 0 a 6):
          - implementacion/*.md
        Operación (procedimientos de rutina):
          - operacion/*.md
        Arquitectura, plataforma y referencia:
          - architecture/*.md
          - hardware/*.md
          - networking/*.md
          - incus/*.md
          - k3s/*.md
          - gitops/*.md
          - storage/*.md
          - secrets/*.md
          - maceosoft/*.md
          - vcluster/*.md
          - capn/*.md
          - ansible/*.md
          - security/*.md
          - labs/cinc/*.md

# Muchas páginas enlazan deliberadamente a fuentes fuera de docs_dir
# (ansible/, repo maceosoft/gitops) en vez de duplicar su contenido aquí.
# MkDocs no puede validar esos archivos por estar fuera de docs/,
# así que se bajan a "info" para no romper `mkdocs build --strict`.
validation:
  links:
    not_found: info

hooks:
  - hooks/i18n.py

# Recargar mkdocs serve al editar el glosario
watch:
  - includes

