# Red de la VM (cloud-init, formato netplan v2). ovn-lan tiene MTU 1442 (el túnel de OVN usa parte del paquete) y su
# DHCP lo ofrece, pero systemd-networkd no lo aplica por defecto: con 1500 los paquetes grandes se pierden y apt se
# queda sin descargar (timeouts). use-mtu hace que la VM tome el MTU del DHCP.
# La interfaz se nombra tal cual (enp5s0, la de las VMs de Incus): con "match: name: en*" cloud-init genera
# "[Match] Name=lan" para systemd-networkd y la VM queda sin red.
version: 2
ethernets:
  enp5s0:
    dhcp4: true
    dhcp4-overrides:
      use-mtu: true
