name: Traducir documentación al inglés (Ollama -> *.en.md)
# Corre en el runner arc-runners del HomeLab y traduce SOLO lo que cambió: translate_docs.py compara el hash de
# cada original con .translations.json, así que una página ya traducida no se vuelve a pedir al modelo.
# Usa el router de Ollama por su Service interno (token Bearer: secreto OLLAMA_TOKEN, item ollama-router de
# 1Password, token "translate").
#
# El resultado no va directo a main: se sube a la rama i18n/traducciones y se abre (o actualiza) un PR para
# revisarlo. Esa rama guarda el avance: cada corrida parte de main, recupera las traducciones que ya estaban en
# la rama y sigue con lo pendiente, así que cortar una corrida no pierde lo traducido.
#
# Presupuesto de tiempo: una traducción incremental tarda minutos. Si pasa de 90 minutos no se empiezan páginas
# nuevas, y a los 105 se corta lo que esté corriendo; lo hecho se sube igual, el job termina en rojo y avisa por
# Discord, porque en este HomeLab eso indica un problema (CPU saturada, nodo de Ollama caído o sin memoria). Lo
# pendiente se retoma con el próximo cambio en docs/ o lanzando el workflow a mano.
#
# Aviso: secreto de GitHub Actions DISCORD_WEBHOOK_AVISOS (campo warnings del item discord-webhooks de 1Password).
# Sin el secreto, el job igual termina en rojo y GitHub avisa por correo.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/**/*.en.md'
      - 'includes/abbreviations.md'
      - 'translate_docs.py'
      - '.github/workflows/translate.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Retraducir todo, aunque no haya cambios (tarda horas en CPU)'
        type: boolean
        default: false

permissions:
  contents: write        # subir la rama i18n/traducciones
  pull-requests: write   # abrir o actualizar el PR

# Dos corridas no deben traducir en paralelo ni pisarse al subir la rama.
concurrency:
  group: translate
  cancel-in-progress: false

env:
  BRANCH: i18n/traducciones
  BUDGET_MINUTES: '90'     # pasado este tope no se empiezan páginas nuevas
  HARD_LIMIT: '105m'       # pasado este tope se corta la página en curso

jobs:
  translate:
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runners
    timeout-minutes: 130
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Partir de main con el avance de la rama de traducciones
        run: |
          git checkout -B "$BRANCH" origin/main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH"
            # Solo las traducciones y su manifiesto: los originales siempre vienen de main.
            files=$(git ls-tree -r --name-only FETCH_HEAD | grep -E '(\.en\.md|^\.translations\.json)$' || true)
            if [ -n "$files" ]; then
              echo "$files" | xargs git checkout FETCH_HEAD --
              echo "Recuperadas $(echo "$files" | wc -l) traducciones de $BRANCH."
            fi
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # Fija 3.14: con '3.x' el runner toma la última (3.15) y dependencias como
          # pydantic_core o MarkupSafe todavía no la soportan.
          python-version: '3.14'

      - name: Instalar dependencias
        run: pip install -r requirements-docs.txt

      - name: Ver qué falta traducir
        id: pending
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ] || ! python translate_docs.py --check; then
            echo "todo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nada pendiente."
          fi

      - name: Traducir lo pendiente
        id: translate
        if: steps.pending.outputs.todo == 'true'
        env:
          OLLAMA_URL: http://ollama-router.ai.svc
          OLLAMA_TOKEN: ${{ secrets.OLLAMA_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          args="--max-minutes $BUDGET_MINUTES"
          [ "$FORCE" = "true" ] && args="$args --force"
          set +e
          # SIGINT a los 105 min y SIGKILL 1 min después si no termina: lo ya escrito queda en disco.
          timeout --signal=INT --kill-after=1m "$HARD_LIMIT" python translate_docs.py $args
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = todo traducido, 1 = páginas descartadas por validación, 3 = presupuesto agotado,
          # 124/137 = cortado por el tope duro. Lo traducido se sube en todos los casos.
          exit 0

      - name: Corregir anclas entre páginas
        if: ${{ always() && steps.pending.outputs.todo == 'true' }}
        run: python translate_docs.py --fix-anchors

      - name: Build del sitio (valida es + en)
        id: build
        if: ${{ always() && steps.pending.outputs.todo == 'true' }}
        run: mkdocs build --strict --clean

      - name: Subir la rama y abrir o actualizar el PR
        id: pr
        if: ${{ always() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.translate.outputs.rc }}
        run: |
          git add -A -- 'docs/**/*.en.md' includes/abbreviations.en.md .translations.json
          if git diff --cached --quiet; then
            echo "Sin traducciones nuevas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(i18n): traducciones al inglés de $(git rev-parse --short origin/main)"
          # La rama es del bot y se rehace sobre main en cada corrida.
          git push --force origin "HEAD:refs/heads/$BRANCH"

          api="https://api.github.com/repos/${{ github.repository }}"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          open=$(curl -fsS "${auth[@]}" "$api/pulls?state=open&head=${{ github.repository_owner }}:$BRANCH" | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$open" = "0" ]; then
            body="Traducciones generadas por translate.yml (corrida ${{ github.run_id }}). Revisa los .en.md antes de mergear: al mergear, deploy-docs.yml publica el sitio."
            [ "$RC" = "3" ] || [ "$RC" = "124" ] || [ "$RC" = "137" ] && body="$body Quedaron páginas pendientes: la próxima corrida las agrega a este PR."
            python -c 'import json,sys; print(json.dumps({"title": "docs(i18n): traducciones al inglés", "head": sys.argv[1], "base": "main", "body": sys.argv[2]}))' "$BRANCH" "$body" \
              | curl -fsS "${auth[@]}" -X POST "$api/pulls" -d @- >/dev/null
            echo "PR abierto."
          else
            echo "PR ya abierto: actualizado con el push."
          fi

      - name: Resultado
        if: ${{ always() && steps.pending.outputs.todo == 'true' }}
        env:
          RC: ${{ steps.translate.outputs.rc }}
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::error::El sitio no compila con las traducciones; no se subió nada."; exit 1
          fi
          case "$RC" in
            0) echo "Traducción completa." ;;
            1) echo "::error::Hubo páginas descartadas por validación; se reintentan en la próxima corrida."; exit 1 ;;
            3|124|137)
              echo "::error::La traducción pasó el presupuesto de tiempo ($BUDGET_MINUTES min). En este HomeLab eso no es normal: revisa la CPU y la memoria de los nodos de Ollama (Grafana) antes de relanzar. Lo traducido quedó en $BRANCH."
              exit 1 ;;
            *) echo "::error::translate_docs.py terminó con $RC."; exit 1 ;;
          esac

      - name: Avisar por Discord
        if: ${{ failure() || cancelled() }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_AVISOS }}
          RC: ${{ steps.translate.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Sin DISCORD_WEBHOOK_AVISOS: el aviso queda solo en GitHub."; exit 0
          fi
          case "$RC" in
            3|124|137) motivo="pasó el presupuesto de $BUDGET_MINUTES min; revisa la CPU y la memoria de los nodos de Ollama en Grafana" ;;
            1) motivo="hubo páginas descartadas por validación" ;;
            *) motivo="falló o se canceló (código ${RC:-sin dato})" ;;
          esac
          msg="⚠️ **Traducción de la documentación**: $motivo. Lo traducido quedó en la rama \`$BRANCH\`. $RUN_URL"
          python -c 'import json,sys; print(json.dumps({"content": sys.argv[1]}))' "$msg" \
            | curl -fsS -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @- >/dev/null
