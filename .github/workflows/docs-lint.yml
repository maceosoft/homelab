name: Lint docs y manifiestos (solo en Pull Requests)
# Corre en el runner arc-runners del HomeLab (no trae herramientas: Python se instala en cada job).
# Los workflows reutilizables equivalentes están en maceosoft/core-pipelines (mkdocs.yml,
# ansible.yml, tofu-validate.yml), pero un repo público no puede llamar a uno privado.
on:
  pull_request:
    branches: [main]

# Un push nuevo al mismo PR cancela la corrida anterior.
concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v7
        with:
          # Historial completo: git-revision-date-localized saca de ahí la fecha de cada página.
          fetch-depth: 0

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: 'docs/**/*.md README.md'

      - uses: actions/setup-python@v7
        with:
          # Fija 3.14: con '3.x' el runner toma la última (3.15) y varias dependencias
          # (pydantic_core, MarkupSafe, PyYAML, ansible) todavía no la soportan.
          python-version: '3.14'

      - name: Build de prueba de MkDocs (sin publicar)
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict --clean

  # Enlaces externos de la documentación (GitHub, docs oficiales): mkdocs --strict solo valida los internos. Las
  # excepciones (homelab.local, repos privados) están en .lycheeignore. Los .en.md tienen los mismos enlaces.
  enlaces:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v7

      - name: Revisar enlaces con lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          # Solo http(s): los enlaces internos (también los de las tarjetas HTML, en formato directorio) los valida
          # mkdocs --strict. 429 es el límite de peticiones del sitio, no un enlace roto.
          args: >-
            --no-progress --max-concurrency 8 --timeout 20 --max-retries 2
            --scheme https --scheme http
            --accept '100..=103,200..=299,429'
            --exclude-path 'docs/.*\.en\.md'
            'docs/**/*.md' README.md
          fail: true
        env:
          # Evita el límite de la API de GitHub para los enlaces a github.com.
          GITHUB_TOKEN: ${{ github.token }}

  ansible:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Fija 3.14: con '3.x' el runner toma la última (3.15) y varias dependencias
          # (pydantic_core, MarkupSafe, PyYAML, ansible) todavía no la soportan.
          python-version: '3.14'

      - name: Instalar Ansible y collections
        run: |
          # Mismas versiones que requirements.txt, para que la CI y tu equipo midan igual.
          pip install $(grep -E '^(ansible|ansible-core|ansible-compat|ansible-lint)==' requirements.txt)
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-lint
        run: ansible-lint ansible/

      - name: Syntax-check playbooks
        env:
          # ansible.cfg pide ~/.vault_pass_homelab, que solo existe en el equipo del operador. En el repo no
          # hay nada cifrado con vault, así que basta un archivo de relleno para que Ansible arranque.
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ runner.temp }}/vault_pass_ci
        run: |
          printf 'ci\n' > "$ANSIBLE_VAULT_PASSWORD_FILE"
          cd ansible
          for pb in playbook-*.yml; do
            ansible-playbook --syntax-check -i inventory.ini "$pb"
          done

  python:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Instalar ruff y shellcheck
        run: |
          # Mismas versiones que requirements.txt, para que la CI y tu equipo midan igual.
          pip install $(grep -E '^(ruff|shellcheck-py)==' requirements.txt)

      - name: ruff (config en ruff.toml)
        run: ruff check ansible/scripts ansible/roles ollama-node hooks translate_docs.py

      - name: shellcheck
        run: shellcheck ansible/scripts/*.sh ansible/roles/ollama_ondemand/files/*.sh ansible/roles/node_units_metrics/files/*.sh ollama-node/macos/install.sh ollama-node/macos/ollama-node

      # Los tests de los roles de métricas (ansible/roles/node_*_metrics/tests/test.sh) necesitan Docker,
      # que el runner no trae: se corren a mano.
      - name: Tests de ollama-node
        working-directory: ollama-node
        run: python -m unittest discover -s tests

      - name: Tests de la guardia de CPU de Ollama
        run: python -m unittest discover -s ansible/roles/ollama_ondemand/tests

      - name: Tests de las métricas de servicios del host
        run: python -m unittest discover -s ansible/roles/node_units_metrics/tests

  opentofu:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v7

      # tofu se descarga en la caché del runner (RUNNER_CACHE, /cache en ARC) y solo se vuelve a bajar si falta o su
      # sha256 no coincide con el publicado por OpenTofu (setup-opentofu lo bajaba en cada job). Los providers los
      # reutiliza de TF_PLUGIN_CACHE_DIR gracias a opentofu/.terraform.lock.hcl.
      - name: Instalar OpenTofu
        env:
          TOFU_VERSION: 1.13.2
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; *) echo "Arquitectura no soportada"; exit 1 ;; esac
          DL_DIR="${RUNNER_CACHE:-$RUNNER_TEMP}/dl"; mkdir -p "$DL_DIR"
          name="tofu_${TOFU_VERSION}_linux_${ARCH}.tar.gz"
          base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
          want="$(curl -fsSL "$base/tofu_${TOFU_VERSION}_SHA256SUMS" | awk -v n="$name" '$2==n {print $1; exit}')"
          [ -n "$want" ] || { echo "::error::Sin checksum publicado para $name"; exit 1; }
          out="$DL_DIR/$name"
          if [ -f "$out" ] && [ "$(sha256sum "$out" | cut -d' ' -f1)" = "$want" ]; then
            echo "$name: desde la caché"
          else
            curl -fsSL "$base/$name" -o "$out.$$" && mv "$out.$$" "$out"
            [ "$(sha256sum "$out" | cut -d' ' -f1)" = "$want" ] || { rm -f "$out"; echo "::error::Checksum incorrecto: $name"; exit 1; }
            echo "$name: descargado"
          fi
          mkdir -p "$RUNNER_TEMP/tofu" && tar xzf "$out" -C "$RUNNER_TEMP/tofu" tofu
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tofu/tofu" version

      - name: tofu fmt -check y validate
        run: |
          cd opentofu
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate
