name: Build y desplegar documentación (MkDocs -> GitHub Pages)
# Corre en el runner arc-runners del HomeLab. El equivalente reutilizable está en
# maceosoft/core-pipelines (mkdocs.yml), pero un repo público no puede llamar a uno privado.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un run nuevo cancela el anterior (en curso o en cola) para que solo se publique lo último de main.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # Fija 3.14: con '3.x' el runner toma la última (3.15) y dependencias como
          # pydantic_core o MarkupSafe todavía no la soportan.
          python-version: '3.14'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Build del sitio
        run: mkdocs build --strict --clean

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: arc-runners
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
