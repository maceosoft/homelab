# Dependabot: avisos de versiones nuevas de las dependencias de este repo (homelab).
# Renovate solo vigila maceosoft/gitops; aquí manda Dependabot y conviven sin pisarse
# (docs/operacion/actualizaciones-de-productos.md, «Y Dependabot de homelab»).
# Sin automerge: el PR pasa por docs-lint.yml (build estricta de MkDocs, ruff, ansible-lint) y lo revisa una persona.
#
# UN SOLO PR por semana con todo: Python, GitHub Actions y OpenTofu, versiones menores y mayores, en el grupo
# multi-ecosistema "todas" (docs.github.com: configuring-multi-ecosystem-updates). Si una versión mayor rompe la CI, el
# PR completo queda en rojo: se arregla en el mismo PR o se agrega esa dependencia a "ignore" hasta resolverla.
# Las actualizaciones de seguridad siguen llegando en PRs propios (no esperan al lunes).
#
# - Lunes 08:00 (Chile): el PR llega al empezar la semana.
# - cooldown de 7 días: no propone una versión hasta que lleve una semana publicada. Las versiones que se retiran o
#   salen comprometidas (ataques a la cadena de suministro) suelen detectarse en esos primeros días.
version: 2

multi-ecosystem-groups:
  todas:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Santiago"
    # En los grupos multi-ecosistema el prefijo del commit va aquí (en cada ecosistema da error de configuración).
    commit-message:
      prefix: "deps"

updates:
  # Python: requirements.txt (Ansible, lint, 1Password) incluye a requirements-docs.txt (MkDocs) con -r.
  # Ojo: los workflows fijan Python 3.14; si una versión nueva no lo soporta, la CI del PR lo muestra.
  - package-ecosystem: "pip"
    directory: "/"
    multi-ecosystem-group: "todas"
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # Cadena que traba el plugin mkdocs-llmstxt (genera llms.txt): llmstxt 0.5.1 pide mdformat-tables, cuya última
      # versión (1.0.0) exige mdformat<0.8, y mdformat 0.7.22 exige markdown-it-py<4. Subir cualquiera de los dos rompe
      # la instalación de requirements-docs.txt (PR #46). Quitar ambas líneas cuando salga un mdformat-tables compatible
      # con mdformat 1.x.
      - dependency-name: "mdformat"
        versions: [">=0.8"]
      - dependency-name: "markdown-it-py"
        versions: [">=4"]
      # ansible-core lo fija el paquete ansible (ansible 14.6.0 pide ansible-core~=2.21.6): si Dependabot sube el core
      # a la menor siguiente por su cuenta, pip no puede instalar el grupo (PR #34). Solo parches del core; la menor
      # nueva llega cuando sube ansible y hay que alinearla a mano con lo que pide.
      - dependency-name: "ansible-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # GitHub Actions de .github/workflows (checkout, setup-python, Pages, lychee, markdownlint).
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "todas"
    patterns: ["*"]
    cooldown:
      default-days: 7

  # OpenTofu: provider lxc/incus (opentofu/main.tf y su .terraform.lock.hcl, del registro de OpenTofu).
  - package-ecosystem: "opentofu"
    directory: "/opentofu"
    multi-ecosystem-group: "todas"
    patterns: ["*"]
    cooldown:
      default-days: 7
