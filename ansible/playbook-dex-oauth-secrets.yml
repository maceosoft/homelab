---
# Secretos OAuth Dex: generar en 1Password, aplicar en ArgoCD, vCluster e Incus (OIDC).
#
# Requiere: app 1Password desbloqueada, pip install onepassword-sdk, kubectl.
# GitHub: GITHUB_CLIENT_ID y GITHUB_CLIENT_SECRET en 1Password (manual).
#
#   cd ansible
#   ansible-playbook -i inventory.ini playbook-dex-oauth-secrets.yml
#
# Tags:
#   ensure     — solo generar/verificar VCLUSTER en 1Password
#   argocd     — patch argocd-secret + restart Dex
#   vcluster   — VCLUSTER_CLIENT_SECRET en release Helm vcluster-platform
#   incus      — instala la CA del HomeLab y configura OIDC en invincible
#   incus_ca   — solo instalar la CA del HomeLab en invincible
#
- name: Secretos OAuth Dex — 1Password (estación operador)
  hosts: localhost
  connection: local
  # Corre en la estación del operador: sin sudo (ansible.cfg tiene become=True).
  become: false
  gather_facts: false
  vars_files:
    - group_vars/dex_oauth_secrets.yml
  environment:
    DEX_OAUTH_GENERATED_FIELDS: "{{ dex_oauth_generated_fields | join(',') }}"
  tasks:
    - name: Asegurar secretos OAuth generados en 1Password
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} scripts/ensure_dex_oauth_secrets.py --json"
        chdir: "{{ playbook_dir }}"
      register: dex_oauth_ensure
      changed_when: (dex_oauth_ensure.stdout | from_json).generated | length > 0
      no_log: true
      tags:
        - ensure
        - argocd
        - vcluster

    - name: Aplicar secretos OAuth en argocd-secret
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} scripts/apply_dex_oauth_to_argocd.py"
        chdir: "{{ playbook_dir }}"
      when: dex_oauth.apply_argocd | default(true)
      changed_when: true
      tags:
        - argocd

    - name: Reiniciar argocd-dex-server
      ansible.builtin.command:
        cmd: kubectl rollout restart deployment argocd-dex-server -n argocd
      when: dex_oauth.restart_dex | default(true) and (dex_oauth.apply_argocd | default(true))
      changed_when: true
      tags:
        - argocd

    - name: Aplicar VCLUSTER_CLIENT_SECRET en vCluster Platform (Helm)
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} scripts/apply_dex_oauth_to_vcluster.py"
        chdir: "{{ playbook_dir }}"
      when: dex_oauth.apply_vcluster | default(false)
      changed_when: true
      tags:
        - vcluster

- name: Incus OIDC — nodo bootstrap
  hosts: invincible
  gather_facts: false
  vars_files:
    - group_vars/dex_oauth_secrets.yml
  vars:
    dex_oauth_incus_settings:
      oidc.issuer: "{{ dex_oauth.incus_oidc.issuer }}"
      oidc.client.id: "{{ dex_oauth.incus_oidc.client_id }}"
  tasks:
    # Incus valida el certificado HTTPS de Dex (issuer). Ese certificado lo firma la CA
    # del HomeLab (cert-manager), que invincible no conoce: sin esto, el login falla con
    # "x509: certificate signed by unknown authority".
    - name: Leer la CA del HomeLab desde el clúster (estación operador)
      ansible.builtin.command:
        # argv (y no cmd): con cmd, Ansible procesa la barra de "ca\.crt" y kubectl recibe una ruta vacía.
        argv:
          - kubectl
          - -n
          - cert-manager
          - get
          - secret
          - homelab-ca
          - -o
          - jsonpath={.data.ca\.crt}
      delegate_to: localhost
      become: false
      register: homelab_ca_b64
      changed_when: false
      check_mode: false
      no_log: true
      when: dex_oauth.apply_incus | default(false)
      tags:
        - incus
        - incus_ca

    - name: Comprobar que la CA leída es un certificado
      ansible.builtin.assert:
        that:
          - "'BEGIN CERTIFICATE' in (homelab_ca_b64.stdout | b64decode)"
        fail_msg: "No se pudo leer ca.crt de cert-manager/homelab-ca (¿KUBECONFIG exportado y cert-manager-config Healthy?)"
        quiet: true
      when: dex_oauth.apply_incus | default(false)
      tags:
        - incus
        - incus_ca

    - name: Instalar la CA del HomeLab en invincible
      ansible.builtin.copy:
        content: "{{ homelab_ca_b64.stdout | b64decode }}"
        dest: /usr/local/share/ca-certificates/homelab-ca.crt
        owner: root
        group: root
        mode: "0644"
      register: homelab_ca_installed
      when: dex_oauth.apply_incus | default(false)
      tags:
        - incus
        - incus_ca

    - name: Actualizar el almacén de certificados
      ansible.builtin.command:
        cmd: update-ca-certificates
      when: dex_oauth.apply_incus | default(false) and homelab_ca_installed is changed
      changed_when: true
      tags:
        - incus
        - incus_ca

    # Incus carga el almacén de certificados al arrancar. Reiniciar el servicio no detiene
    # las instancias en ejecución (corren fuera del daemon), pero la API queda unos segundos
    # sin responder.
    - name: Reiniciar Incus para que confíe en la CA
      ansible.builtin.systemd:
        name: incus
        state: restarted
      when: dex_oauth.apply_incus | default(false) and homelab_ca_installed is changed
      tags:
        - incus
        - incus_ca

    # Incus (7.x) solo conoce estas claves OIDC: issuer, client.id, audience, claim y scopes.
    # No tiene client.secret (usa un cliente público con PKCE: en Dex, incus-ui es "public")
    # ni groups.claim, ni el comando "incus auth" (eso es de LXD).
    - name: Leer la configuración OIDC actual de Incus
      ansible.builtin.command:
        cmd: incus config get {{ item.key }}
      loop: "{{ dex_oauth_incus_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: dex_oauth_incus_current
      changed_when: false
      when: dex_oauth.apply_incus | default(false)
      tags:
        - incus

    - name: Configurar OIDC en Incus (solo las claves que cambian)
      ansible.builtin.command:
        cmd: incus config set {{ item.item.key }}={{ item.item.value }}
      loop: "{{ dex_oauth_incus_current.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when:
        - dex_oauth.apply_incus | default(false)
        - item.stdout | trim != item.item.value
      changed_when: true
      tags:
        - incus
