---
# Desinstalación del clúster K3s (Control Plane y Agents)
#
# Ejecutar:
#   ansible-playbook -i inventory.ini playbook-uninstall-k3s.yml

- name: Desinstalar K3s (Control Plane y Agents)
  hosts: incus_cluster
  become: true
  gather_facts: false

  vars:
    control_plane_host: "deborah"

  tasks:
    # ----------------------------------------------------
    # 1. DESINSTALAR AGENTS EN LOS WORKERS
    # ----------------------------------------------------
    - name: Verificar si existe el script de desinstalación del Agent
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-agent-uninstall.sh
      register: k3s_agent_uninstall_bin
      when: inventory_hostname != control_plane_host

    - name: Ejecutar script de desinstalación de K3s Agent
      ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
      changed_when: true
      when:
        - inventory_hostname != control_plane_host
        - k3s_agent_uninstall_bin.stat.exists

    # ----------------------------------------------------
    # 2. DESINSTALAR SERVER EN EL CONTROL PLANE
    # ----------------------------------------------------
    - name: Verificar si existe el script de desinstalación del Server
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: k3s_server_uninstall_bin
      when: inventory_hostname == control_plane_host

    - name: Ejecutar script de desinstalación de K3s Server
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      changed_when: true
      when:
        - inventory_hostname == control_plane_host
        - k3s_server_uninstall_bin.stat.exists

    # ----------------------------------------------------
    # 3. LIMPIEZA ADICIONAL (Directorios residuales)
    # ----------------------------------------------------
    - name: Eliminar directorios de configuración de K3s residuales
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher
        - /var/lib/rancher
        - /var/lib/kubelet
        - /run/k3s
      failed_when: false
