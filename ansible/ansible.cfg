# ansible.cfg — configuración del proyecto HomeLab
#
# Ansible busca este archivo, en orden de prioridad, en:
#   1. $ANSIBLE_CONFIG (variable de entorno, si está definida)
#   2. ./ansible.cfg (directorio actual desde donde se invoca `ansible-playbook`)
#   3. ~/.ansible.cfg (config de usuario)
#   4. /etc/ansible/ansible.cfg (config global del sistema)
#
# Al vivir en ansible/ansible.cfg, se aplica automáticamente siempre que
# los comandos `ansible` / `ansible-playbook` se ejecuten desde dentro de
# esta carpeta (que es como están documentados los playbooks del repo:
# `cd ansible/ && ansible-playbook -i inventory.ini playbook-*.yml`).
# Si se invoca desde otra carpeta, hay que exportar ANSIBLE_CONFIG apuntando
# aquí para que estas opciones se respeten.
#
# Este archivo está deliberadamente sobre-documentado: este repo es también
# un laboratorio de aprendizaje, así que se listan más opciones de las que
# harían falta en un ansible.cfg mínimo, incluyendo algunas dejadas en su
# valor por defecto mostrado explícito (comentado o no) para que sirvan de
# referencia rápida sin tener que ir a la documentación oficial cada vez.
# Ver: https://docs.ansible.com/ansible/latest/reference_appendices/config.html
#
# Para ver en cualquier momento qué configuración está realmente activa
# (este archivo + defaults + variables de entorno), correr:
#   ansible-config dump --only-changed


[defaults]

# --- Inventario y localización de código ---------------------------------

# Inventario por defecto del HomeLab (los 3 nodos: invincible, oliver,
# deborah). Con esto ya no hace falta pasar `-i inventory.ini` a mano
# en cada comando, aunque los ejemplos de los playbooks lo sigan mostrando
# explícito por claridad/portabilidad.
inventory = inventory.ini

# Carpeta(s) donde Ansible busca roles reutilizables (`ansible-galaxy role
# init` los crea aquí). Los roles propios del HomeLab viven en roles/. Acepta
# una lista separada por ':' si se quiere sumar, por ejemplo, roles instalados
# vía Galaxy en una carpeta separada del código propio.
roles_path = roles

# Carpetas de plugins custom, por si el HomeLab llega a necesitar módulos,
# filtros Jinja2 o lookups propios (p.ej. un módulo que hable con la API
# de Incus en vez de usar `command:` + `incus` CLI). No existen todavía; se
# dejan declaradas como referencia de dónde deberían vivir si se crean.
library = ./library
filter_plugins = ./filter_plugins
module_utils = ./module_utils

# --- Comportamiento de ejecución ------------------------------------------

# HomeLab con 3 nodos únicamente: no hace falta paralelismo alto. El valor
# por defecto de Ansible es 5; lo bajamos a 3 para que, si algo falla en un
# host, el output intercalado sea más fácil de leer host por host. Subir
# este número no tiene beneficio real hasta que el inventario crezca mucho
# más allá de estos 3 nodos.
forks = 3

# Usuario remoto con el que se conecta SSH por defecto si un host no lo
# especifica. Se deja comentado a propósito: cada quien clona este repo
# con un usuario distinto en su LAN, así que forzar un valor aquí rompería
# la portabilidad. Ajústalo si tu usuario SSH es el mismo en los 3 nodos:
#remote_user = tu_usuario

# Estrategia de ejecución de tareas. 'linear' (el default) espera a que
# todos los hosts terminen una tarea antes de pasar a la siguiente — el
# comportamiento más predecible y el más fácil de razonar para un HomeLab
# pequeño. 'free' deja que cada host avance a su ritmo (más rápido con
# fleets grandes y heterogéneas, pero más difícil de leer en el output).
# Se deja explícito el default por documentación.
strategy = linear

# Cuántos segundos esperar entre reintentos de polling de una tarea
# asíncrona (async: / poll:), como el `netplan apply` de netplan_bridge o
# los pasos largos de playbook-upgrade-debian13.yml.
poll_interval = 15

# Timeout de conexión SSH (también el que usa Ansible para esperar el
# prompt de escalación de become). El default de Ansible es 10s.
timeout = 60

# --- Recolección de facts ---------------------------------------------

# 'smart' (el default) solo recolecta facts si algún play los necesita y
# aún no los tiene cacheados en esa corrida. Se deja explícito porque es
# la opción más razonable para este repo: los playbooks actuales (
# bootstrap, set-static-ip) sí usan facts implícitos (ansible_* dentro de
# templates Jinja2 si se llegaran a usar) y no vale la pena forzar
# 'explicit' (que exigiría un `setup:` manual en cada play) ni 'all'
# (que ralentiza sin necesidad en un lab de 3 nodos).
gathering = smart

# Subconjunto de facts a recolectar cuando gathering los pide. 'all' es el
# default (hardware, red, virtualización, etc. — es bastante). En un
# HomeLab de 3 nodos conocidos el costo no importa, así que se deja 'all'
# explícito en vez de recortarlo a 'min' (que solo trae lo esencial y
# aceleraría discretamente cada corrida, mismo con solo 3 hosts).
gather_subset = all

# Cachear facts entre corridas para no tener que re-recolectarlos cada vez
# que se ejecuta un playbook (relevante si se agregan más playbooks que
# corran seguido). Desactivado por defecto en este repo: con 3 nodos el
# recolectar facts en frío es rápido y evitamos el riesgo de trabajar con
# facts obsoletos (p.ej. una IP vieja) después de aplicar
# playbook-set-static-ip.yml.
fact_caching = memory
#fact_caching = jsonfile
#fact_caching_connection = /tmp/ansible_facts_cache
#fact_caching_timeout = 86400

# --- Salida y logging ---------------------------------------------------

# Callback plugin que formatea el output de cada tarea con separación clara
# por host y resumen final más legible que el formato JSON crudo del stdout.
# Útil especialmente en playbook-set-static-ip.yml, donde el output de
# `ip -br link` por host se revisa con atención antes de tocar la red.
#
# NOTA: antes esto era `stdout_callback = yaml`, que resolvía al plugin
# community.general.yaml. Ese plugin fue eliminado en community.general
# 12.0.0 (ver error "[ERROR]: The 'community.general.yaml' callback plugin
# has been removed"). El reemplazo oficial, disponible desde ansible-core
# 2.13, es usar el callback 'default' de ansible-core con
# result_format=yaml (ver sección [callback_default] más abajo).
stdout_callback = default

# Muestra las tareas que se van a saltar (skipped) explícitamente en el
# output en lugar de solo omitirlas en silencio. Ayuda a confirmar, por
# ejemplo, que la tarea "Pausa de seguridad" de playbook-set-static-ip.yml
# efectivamente se saltó en modo --check (dry-run) y no se ejecutó por error.
display_skipped_hosts = True

# Con True, Ansible imprime los argumentos de cada tarea junto a su nombre.
# Queda en False: algunos argumentos llevan rutas o valores que no conviene
# ver en la salida, y los nombres de las tareas ya dicen qué hace cada una.
display_args_to_stdout = False

# Ruta de un archivo de log persistente con todo lo que Ansible ejecuta.
# Comentado por defecto para no ensuciar el repo con logs locales (y para
# no versionar por accidente contraseñas o IPs si algún día se agrega
# `no_log: false` a una tarea sensible). Descomenta si quieres auditoría
# local de cada corrida sobre los 3 nodos:
#log_path = ./ansible.log

# Desactiva el arte ASCII de "cowsay" en el output. Es puramente estético,
# pero se deja explícito porque en un log de un HomeLab educativo conviene
# que el output sea consistente y fácil de pegar en la documentación
# (docs/) sin arte ASCII de por medio.
nocows = True

# Mantiene visibles los warnings de deprecación de módulos/sintaxis y los
# warnings genéricos de comandos peligrosos (p.ej. usar `shell:` cuando
# existe un módulo dedicado — cosa que playbook-bootstrap.yml hace a
# propósito para el instalador de Zabbly, que no tiene módulo nativo).
# Se dejan activos porque el propósito educativo del repo se beneficia de
# ver esos avisos en vez de silenciarlos.
deprecation_warnings = True
command_warnings = True

# --- Rutas temporales y SFTP ---------------------------------------------

# Carpeta temporal en el nodo de control (donde corre `ansible-playbook`,
# normalmente tu laptop) usada para artefactos intermedios. Se deja el
# default del sistema; solo se documenta aquí para que quede claro que
# existe un equivalente remoto (remote_tmp) que si importa en este repo.
local_tmp = ~/.ansible/tmp

# Carpeta temporal en cada nodo remoto (invincible, oliver, deborah)
# donde Ansible copia módulos antes de ejecutarlos. Se deja el default
# (~/.ansible/tmp dentro del $HOME del usuario remoto) porque los 3 nodos
# tienen usuarios SSH con home propio y espacio de sobra; no hace falta
# redirigirlo a /tmp global.
remote_tmp = ~/.ansible/tmp

# --- Vault (secretos) -----------------------------------------------------

# Hoy no hay nada cifrado con Ansible Vault en el repo (los secretos viven
# en 1Password). La línea queda activa para el día que algún playbook necesite
# un valor cifrado; por eso Ansible pide que el archivo exista y la CI usa
# uno de relleno.
vault_password_file = ~/.vault_pass_homelab


[callback_default]

# Formatea los resultados de cada tarea (los bloques "ok"/"changed") como
# YAML en vez del JSON compacto por defecto — es el reemplazo soportado de
# la vieja opción `stdout_callback = yaml` (ver nota arriba en [defaults]).
result_format = yaml


[inventory]

# Evita que Ansible falle silenciosamente si algún plugin de inventario
# dinámico no está disponible; con inventory.ini (formato INI estático)
# esto no debería disparar nunca, pero se deja explícito por si en el
# futuro se agrega un inventario dinámico (p.ej. contra la API de Incus
# para descubrir instancias automáticamente en vez de listarlas a mano).
unparsed_is_failed = True

# Plugins de inventario habilitados, en orden de intento. 'ini' cubre el
# inventory.ini actual del repo; se dejan también 'yaml' y 'host_list' por
# si el inventario migra a YAML (más cómodo para expresar bridge_iface,
# static_ip, etc. como estructuras anidadas en vez de key=value planos).
enable_plugins = host_list, ini, yaml, auto

# Cachear el resultado de inventarios dinámicos entre corridas. Sin uso
# hoy (inventario estático), se deja documentado para cuando aplique:
#cache = True
#cache_plugin = jsonfile
#cache_connection = /tmp/ansible_inventory_cache
#cache_timeout = 3600


[privilege_escalation]

# Casi todos los playbooks tocan el sistema (paquetes, netplan, servicios) y
# necesitan root, así que become = True es el default. Los plays que corren en
# la estación del operador (1Password, kubectl) lo apagan con `become: false`.
become = True

# Mecanismo de escalación. 'sudo' es el estándar en Debian/Ubuntu, que es
# lo que corren los 3 nodos (ver docs/hardware/inventory.md). Alternativas
# como 'su' o 'doas' no aplican a este stack.
become_method = sudo

# Usuario objetivo al escalar privilegios. 'root' es el default y es lo
# que necesitan tanto la instalación de Incus (paquetes del sistema) como
# la escritura en /etc/netplan/. Se deja explícito por claridad.
become_user = root

# No se pide contraseña de sudo: bootstrap/setup_sudo.yml deja a tu usuario
# administrador con NOPASSWD en /etc/sudoers.d/<usuario>.
#become_ask_pass = True
become_ask_pass = False

# Flags extra pasados al comando sudo remoto. '-H' fuerza HOME=/root
# (evita que módulos que dependen de variables de entorno de home usen por
# error el $HOME del usuario SSH sin privilegios); '-S' hace que sudo lea
# la contraseña por stdin, que es como Ansible se la entrega cuando hay
# contraseña. Es el valor por defecto de Ansible, se deja explícito.
become_flags = -H -S


[ssh_connection]

# Ejecuta cada módulo por la misma sesión SSH, sin copiar antes un archivo
# temporal al nodo: menos operaciones SSH por tarea. (La reutilización de la
# conexión entre tareas es ControlMaster, en ssh_args más abajo.)
pipelining = True

# Argumentos SSH explícitos:
#   -o ControlMaster=auto      -> reutiliza conexión si ya existe, si no la crea
#   -o ControlPersist=60s      -> mantiene la conexión maestra viva 60s tras
#                                  terminar, por si el siguiente play la reusa
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Dónde guardar el socket de control de la conexión maestra (usado por
# ControlMaster de arriba). El patrón con hash evita colisiones de nombre
# de archivo cuando se conecta a hosts distintos con el mismo puerto/user.
control_path = %(directory)s/%%h-%%p-%%r

# Reintentos de conexión SSH antes de marcar el host como fallido. Subido
# de 3 (default) a 5 porque playbook-set-static-ip.yml corta la sesión SSH
# intencionalmente al aplicar netplan; en la corrida donde eso pasa
# conviene algo más de margen para reconexiones transitorias en la
# ventana en que la interfaz sube de nuevo.
retries = 5

# Método de transferencia de archivos hacia los nodos remotos (usado por
# el módulo `template:` en playbook-set-static-ip.yml para copiar
# br0.yaml.j2 ya renderizado). 'smart' (el default) prueba SFTP primero y
# cae a SCP si falla; se deja explícito porque es la opción más robusta
# sin tener que saber de antemano si cada nodo tiene sftp-server
# habilitado en su sshd_config.
transfer_method = smart

# Si transfer_method tuviera que forzar SCP en vez de SFTP, este flag
# evita que scp intente expandir rutas remotas con shell globbing (más
# seguro y predecible). Sin efecto mientras 'smart' use SFTP, se deja
# documentado como buena práctica.
scp_if_ssh = smart


[persistent_connection]

# Timeout de conexiones persistentes (usadas por tipos de conexión
# network_cli/netconf, no por el 'ssh' estándar que usan estos playbooks).
# Los 3 nodos son hosts Linux normales vía SSH, así que esta sección no
# aplica en la práctica hoy — se deja el default documentado por si el
# HomeLab llega a incorporar equipos de red gestionables (switch/router
# con soporte Ansible) que sí usen conexiones persistentes.
connect_timeout = 30
command_timeout = 30


[diff]

# Cuando se corre con --diff (recomendado siempre en
# playbook-set-static-ip.yml, ver el comentario de dry-run en ese
# playbook), muestra el diff completo del archivo generado
# (/etc/netplan/br0.yaml) en vez de truncarlo. Importante en este repo
# porque ese diff es exactamente lo que hay que revisar antes de aplicar
# un cambio de red que puede cortar el acceso SSH.
always = False
context = 3


[colors]

# Colores de output. Se dejan los defaults de Ansible documentados; útil
# tenerlos a mano si se quiere diferenciar más los 'changed' (amarillo)
# de los 'skipped' (celeste) al revisar corridas largas contra los 3
# nodos en una terminal.
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan


[galaxy]

# Servidor por defecto de Ansible Galaxy para instalar roles/collections
# externos (p.ej. una collection community.general si en el futuro se
# reemplaza algún `shell:`/`command:` suelto de los playbooks por un
# módulo dedicado). Sin roles externos instalados hoy en el repo, se deja
# el default oficial documentado.
server = https://galaxy.ansible.com

# Ruta donde se instalan roles bajados de Galaxy con `ansible-galaxy role
# install`. Separada de roles_path (arriba) para no mezclar roles propios
# del repo con roles de terceros descargados.
roles_path = ~/.ansible/roles
collections_path = ~/.ansible/collections


# --------------------------------------------------------------------
# NOTA sobre host_key_checking (deliberadamente NO desactivado aquí):
#
# Se decidió NO poner `host_key_checking = False` en [defaults] pese a
# ser una opción común en HomeLabs (y pese a que Ansible la habría
# aceptado ahí, no en [ssh_connection]). Los 3 nodos ya fueron accedidos
# por SSH manualmente al menos una vez (según docs/networking/index.md,
# que advierte que aplicar netplan corta la sesión SSH actual), así que
# sus host keys ya deberían estar en ~/.ssh/known_hosts. Mantener la
# verificación activa protege contra el caso real de este repo: nodos que
# cambian de IP (DHCP -> IP fija vía playbook-set-static-ip.yml) y podrían,
# en teoría, ser suplantados en la LAN. Si una IP cambia legítimamente,
# hay que limpiar la entrada vieja de known_hosts a mano:
#   ssh-keygen -R <ip-vieja>
# en vez de desactivar la verificación por completo.
#
# Si en algún momento quieres desactivarla igual (p.ej. para reinstalar
# nodos seguido durante pruebas y no lidiar con known_hosts cada vez),
# el valor va en [defaults]:
#   host_key_checking = False
# --------------------------------------------------------------------
