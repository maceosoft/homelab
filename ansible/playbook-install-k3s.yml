---
# Instalación de clúster K3s — wrapper de compatibilidad.
# Opciones bootstrap: docs/k3s/playbook-options.md
# Las flags (kube_vip, gitops_argocd, etc.) se activan editando
# group_vars/incus_cluster/k3s_install.yml, NO con -e k3s_install.x.y=valor
# (Ansible no fusiona claves con puntos contra un dict existente: lo ignora, y el playbook
# lo detecta y falla). Para CNI, ArgoCD y etiquetas hay variables de nivel superior:
#   ansible-playbook -i inventory.ini playbook-k3s.yml -e k3s_cni=canal
#   ansible-playbook -i inventory.ini playbook-k3s.yml
- name: Instalar K3s (alias de playbook-k3s.yml)
  ansible.builtin.import_playbook: playbook-k3s.yml
