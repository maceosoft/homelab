---
# Rota la password de root en los 3 nodos y la guarda en 1Password (boveda
# HomeLab, item root@<host>, via SDK Python + DesktopAuth). Ver
# scripts/rotate_root_passwords.py y docs/security/hardening-post-incidente.md.
#
# No es idempotente a proposito: CADA corrida genera y aplica una password
# nueva. No toca autenticacion SSH (PermitRootLogin ya esta en "no" via
# host_hardening) -- es defensa en profundidad para consola/`su -`.
#
# Requiere: app 1Password desbloqueada en la estacion del operador,
# `pip install onepassword-sdk passlib` (ver requirements.txt).
#
#   cd ansible
#   ansible-playbook -i inventory.ini playbook-rotate-root-passwords.yml
#   ansible-playbook -i inventory.ini playbook-rotate-root-passwords.yml --limit deborah

- name: "Rotar password de root (1Password: bóveda HomeLab)"
  hosts: incus_cluster
  become: true
  gather_facts: false
  tasks:
    - name: Generar y guardar password nueva en 1Password (estación del operador)
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} scripts/rotate_root_passwords.py --json {{ inventory_hostname }}"
        chdir: "{{ playbook_dir }}"
      delegate_to: localhost
      become: false
      # Un host a la vez contra el SDK de 1Password (con forks=3 las escrituras compiten por el mismo cliente de escritorio).
      throttle: 1
      register: host_hardening_root_password_rotation
      changed_when: true
      no_log: true

    - name: Leer password generada para este host
      ansible.builtin.set_fact:
        host_hardening_root_password_new: >-
          {{ (host_hardening_root_password_rotation.stdout | from_json)[inventory_hostname] }}
      no_log: true

    - name: Aplicar password nueva a root
      ansible.builtin.user:
        name: root
        password: "{{ host_hardening_root_password_new | password_hash('sha512') }}"
        update_password: always
      no_log: true
