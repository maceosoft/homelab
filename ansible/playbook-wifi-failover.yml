---
# WiFi de respaldo del cable en los nodos con hardware WiFi (has_wifi:
# true y wifi_iface en host_vars -- hoy: invincible, deborah, eve). oliver
# no tiene WiFi fisico, queda fuera.
#
# Requiere en la estacion: 1Password desbloqueado, el SDK
# (pip install onepassword-sdk) y ONEPASSWORD_ACCOUNT_NAME exportado. El SSID
# y la clave se leen de op://HomeLab/wifi-homelab/{ssid,psk}.
#
# Ejecutar:
#   ansible-playbook -i inventory.ini playbook-wifi-failover.yml -l <nodo> --check --diff
#   ansible-playbook -i inventory.ini playbook-wifi-failover.yml -l <nodo>

- name: Configurar WiFi de respaldo
  hosts: incus_cluster
  become: true
  tasks:
    - name: Aplicar wifi_failover en nodos con hardware WiFi
      ansible.builtin.include_role:
        name: wifi_failover
      when: has_wifi | default(false)
