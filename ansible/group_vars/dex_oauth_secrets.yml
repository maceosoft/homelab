---
# playbook-dex-oauth-secrets.yml — secretos OAuth Dex (1Password + clúster)
#
# Los campos de GitHub debes crearlos en la OAuth App y en 1Password. Los demás clientes de Dex (Incus, Grafana,
# Open WebUI, opkssh, kubectl) son públicos (PKCE, "public: true"): no tienen secreto.

dex_oauth:
  apply_argocd: true
  restart_dex: true
  apply_incus: true
  incus_oidc:
    issuer: https://argocd.homelab.local/api/dex
    client_id: incus-ui
    # Grupos de Dex (claim groups, "org:team") que pueden usar Incus. Dex deja entrar también al team ia (solo para
    # Open WebUI); sin esta lista, Incus le daría acceso total.
    allowed_groups:
      - maceosoft:devops

# Campos OAuth que Ansible genera en 1Password cuando no existen.
# Misma lista se pasa a los scripts vía DEX_OAUTH_GENERATED_FIELDS.
# Los de GitHub (GITHUB_*) se crean manualmente en la OAuth App.
# Hoy ninguno; un cliente confidencial nuevo suma aquí su campo (y su clave en DEX_OAUTH_FIELD_MAP del script).
dex_oauth_generated_fields: []
