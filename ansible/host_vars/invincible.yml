---
incus_role: "Bootstrap / leader (pendiente instalación)"
incus_cluster_role: bootstrap
incus_cluster_groups: [x86-nodes, default]
k3s_role: agent
ip_static: true
k3s_node_labels:
  node.longhorn.io/create-default-disk: "true"
ansible_python_interpreter: /usr/bin/python3

# --- Ollama (rol ollama_ondemand) ---
# i7-8700T, 15,5 GB (~6 GB libres, aloja el monitoreo): modelo de código y el modelo general. Es el nodo preferido para
# qwen2.5:7b-instruct (prioridad mayor que deborah): deborah es control-plane y DNS, y en su CPU ARM cada respuesta del 7B
# la satura durante un minuto. Cabe justo en 5500M y Ollama carga un modelo a la vez.
ollama_ondemand_models:
  - qwen2.5-coder:7b
  - qwen2.5:7b-instruct
ollama_ondemand_memory_max: 5500M
ollama_node_priority: 80
ollama_node_tags: [x86, code, always-on]
