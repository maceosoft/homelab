---
# Secretos de plataforma de la org maceosoft: 1Password -> clúster.
# Guía: docs/maceosoft/github.md
#
# Crea los namespaces argocd, arc-runners (PSS baseline) y terraform (state de
# OpenTofu) y los Secrets que GitOps necesita antes de arrancar:
#   - argocd/repo-gitops                   App maceosoft-argocd: lee maceosoft/gitops (privado)
#   - arc-runners/arc-runners-github-app   App de ARC
#   - arc-runners/terraform-app             App de OpenTofu (TF_VAR_github_app_*)
#   - arc-runners-symintel/...              mismos Secrets para la org antigua (items symintel-arc-runners / -terraform, opcionales)
#   - arc-runners/tofu-vars                TF_VAR_ftp (items ftp-<repo>)
#   - monitoring/discord-webhooks          webhooks de Discord de Alertmanager (items opcionales de
#     monitoring/healthchecks-ping         monitoreo: discord-webhooks, healthchecks-ping y grafana-admin;
#     monitoring/grafana-admin             namespace "monitoring" con pod-security privileged)
#   - ai/open-webui-secret                 WEBUI_SECRET_KEY de Open WebUI (item opcional open-webui; asistente de IA)
#   - ai/ollama-router-secrets             tokens del router de Ollama (item opcional ollama-router: registry_token,
#     ai/ollama-token-open-webui           open-webui, k8sgpt, reports, alert-triage, translate) y un Secret por cliente:
#     monitoring/ollama-token-reports      ollama-token-<cliente> con la clave "token" (reports y alert-triage en monitoring,
#     monitoring/ollama-token-alert-triage k8sgpt en k8sgpt-operator-system, open-webui en ai)
#     k8sgpt-operator-system/ollama-token-k8sgpt
#   - monitoring/alert-triage-webhook      token del webhook de alert-triage (item opcional alert-triage-webhook, campo token)
#   - ai/mcp-api-key                       API key de mcpo (item opcional mcp-api-key, campo key)
#   - ai-sandbox/open-terminal-api-key     API key de Open Terminal (item opcional open-terminal, campo api_key;
#     ai/open-terminal-api-key             el mismo valor en ambos; los namespaces ai y ai-sandbox se crean sin
#     etiqueta PSA: su PSA es de GitOps)
#   - monitoring/discord-webhooks          además la clave "ai" (canal #ia) si el item discord-webhooks tiene el campo ai
#
# Requiere: app 1Password desbloqueada (Integrate with other apps),
# pip install onepassword-sdk y el kubeconfig del homelab. Usa SIEMPRE
# platform_kubeconfig (default: el que deja k3s_fetch_kubeconfig), no el
# contexto actual de kubectl, para no escribir secretos en otro clúster.
# Otro kubeconfig: -e platform_kubeconfig=/ruta/kubeconfig
# Correr después de playbook-k3s.yml y antes de aplicar bootstrap/root-appset.yaml de gitops.
#
#   cd ansible
#   ansible-playbook -i inventory.ini playbook-platform-secrets.yml
#
# Idempotente: re-correrlo tras rotar una credencial en 1Password.
- name: Secretos de plataforma maceosoft — 1Password (estación operador)
  hosts: localhost
  connection: local
  # Corre en la estación del operador: sin sudo (ansible.cfg tiene become=True).
  become: false
  gather_facts: false
  vars:
    platform_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/homelab-k3s.yaml"
  environment:
    KUBECONFIG: "{{ platform_kubeconfig }}"
  tasks:
    - name: Verificar que el kubeconfig apunta al clúster k3s del homelab
      ansible.builtin.command:
        cmd: kubectl get nodes -o name
      register: platform_nodes
      changed_when: false
      check_mode: false   # solo lee: también corre con -C

    # Con -C (--check) corre el script en --dry-run: lee 1Password y muestra
    # los Secrets que crearía, con los valores ocultos, sin tocar el clúster.
    - name: Aplicar namespaces y Secrets desde 1Password
      ansible.builtin.command:
        cmd: >-
          {{ ansible_playbook_python }} scripts/apply_platform_secrets.py
          {{ '--dry-run' if ansible_check_mode else '' }}
        chdir: "{{ playbook_dir }}"
      register: platform_secrets
      changed_when: not ansible_check_mode
      check_mode: false
      no_log: "{{ not ansible_check_mode }}"

    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ platform_secrets.stdout }}"
