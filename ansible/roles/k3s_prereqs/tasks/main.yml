---
- name: Deshabilitar swap en runtime
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Comentar swap en fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+)'
    replace: '# \1'

# Comentar fstab no alcanza: systemd activa por su cuenta las particiones de tipo swap de la tabla GPT
# (unidades dev-disk-by-diskseq-N-partM.swap, cuyo nombre cambia entre arranques). Enmascarar swap.target corta
# todas esas activaciones automáticas. El zram de Orange Pi hace swapon por su cuenta: lo apaga host_hardening.
- name: No activar swap al arrancar (swap.target enmascarado)
  ansible.builtin.systemd_service:
    name: swap.target
    masked: true

- name: Cargar modulos de kernel para K3s
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
      overlay
    mode: "0644"

- name: Cargar modulos ahora
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Configurar sysctl para CNI
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k3s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
    mode: "0644"

- name: Aplicar sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

# Longhorn (volúmenes replicados) exige estos paquetes y el módulo iSCSI
# en cada nodo; sin ellos longhorn-manager queda en CrashLoopBackOff.
- name: Instalar requisitos de Longhorn (iSCSI y NFS)
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: k3s_prereqs_longhorn_pkgs

# En --check el paquete no se instala de verdad: el servicio todavía no existe.
- name: Habilitar iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  when: not (ansible_check_mode and k3s_prereqs_longhorn_pkgs is changed)

- name: Cargar el modulo iscsi_tcp al arrancar
  ansible.builtin.copy:
    dest: /etc/modules-load.d/longhorn.conf
    content: |
      iscsi_tcp
    mode: "0644"

- name: Cargar iscsi_tcp ahora
  community.general.modprobe:
    name: iscsi_tcp
    state: present
