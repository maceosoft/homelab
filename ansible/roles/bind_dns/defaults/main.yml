---
bind_dns_chroot_dir: /var/lib/named

# Directorios del chroot (root:bind 0750)
bind_dns_chroot_dirs:
  - ""
  - dev
  - etc
  - usr
  - usr/share
  - var
  - var/cache
  - var/lib
  - run
  - run/systemd

# Bind mounts hacia el chroot (origen fuera del chroot -> ruta dentro)
bind_dns_chroot_mounts:
  - { src: /dev/null, path: dev/null, kind: file }
  - { src: /dev/random, path: dev/random, kind: file }
  - { src: /usr/share/dns, path: usr/share/dns, kind: dir }
  - { src: /var/cache/bind, path: var/cache/bind, kind: dir }
  - { src: /var/lib/bind, path: var/lib/bind, kind: dir }
  - { src: /run/named, path: run/named, kind: dir }
  - { src: /run/systemd/notify, path: run/systemd/notify, kind: file }

# Este DNS es para todos (LAN, otras subredes del router, VPN…): por defecto NO se limita
# por origen. Con bind_dns_restrict_clients: true solo atienden los de bind_dns_allowed_clients.
bind_dns_restrict_clients: false
# Clientes de la ACL "lan" (solo se usa con bind_dns_restrict_clients: true): la LAN y los
# CIDR de pods/servicios de K3s (CoreDNS consulta con IP de pod).
bind_dns_allowed_clients:
  - "{{ lan_cidr }}"
  - "{{ ((k3s_install | default({})).get('core', {})).get('cluster_cidr', '10.42.0.0/16') }}"
  - "{{ ((k3s_install | default({})).get('core', {})).get('service_cidr', '10.43.0.0/16') }}"
# Rate-limit de respuestas idénticas (anti-amplificación), APAGADO por defecto para no limitar
# a nadie (una VPN o un NAT concentra muchos usuarios en una IP). Si se activa, los clientes de
# bind_dns_rate_limit_exempt quedan exentos (la LAN incluida: los nodos comparten una /24).
bind_dns_rate_limit_enabled: false
bind_dns_rate_limit_rps: 20
bind_dns_rate_limit_exempt: "{{ bind_dns_allowed_clients }}"
