---
- name: Instalar BIND y dig
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-dnsutils
    state: present
    update_cache: true
  register: bind_dns_pkg

# --- chroot en /var/lib/named ----------------------------------------------
- name: Verificar si /etc/bind ya es un symlink al chroot
  ansible.builtin.stat:
    path: /etc/bind
  register: bind_dns_etc_bind

- name: Detener named antes de mover la configuración al chroot
  ansible.builtin.systemd:
    name: named
    state: stopped
  when:
    - not bind_dns_etc_bind.stat.islnk | default(false)
    - not (ansible_check_mode and bind_dns_pkg is changed)

- name: Crear los directorios reales que se montan dentro del chroot
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: bind
    group: bind
    mode: "0775"
  loop:
    - /var/cache/bind
    - /var/lib/bind

# /run/named vive en tmpfs: lo que haga Ansible se pierde al reiniciar. En el arranque lo crea systemd-tmpfiles
# con /usr/lib/tmpfiles.d/named.conf (de bind9); este archivo en /etc lo reemplaza con los valores del rol, así el
# arranque y el playbook dejan el mismo dueño y modo (antes el rol ponía bind:bind y cada corrida tras un
# reinicio daba changed).
- name: Fijar /run/named en tmpfiles.d
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/named.conf
    content: |
      # Gestionado por Ansible (rol bind_dns). Reemplaza /usr/lib/tmpfiles.d/named.conf.
      d /run/named {{ bind_dns_run_dir_mode }} {{ bind_dns_run_dir_owner }} {{ bind_dns_run_dir_group }} - -
    owner: root
    group: root
    mode: "0644"

- name: Crear /run/named (mismo dueño y modo que tmpfiles.d)
  ansible.builtin.file:
    path: /run/named
    state: directory
    owner: "{{ bind_dns_run_dir_owner }}"
    group: "{{ bind_dns_run_dir_group }}"
    mode: "{{ bind_dns_run_dir_mode }}"

- name: Crear los directorios del chroot
  ansible.builtin.file:
    path: "{{ bind_dns_chroot_dir }}/{{ item }}"
    state: directory
    owner: root
    group: bind
    mode: "0750"
  loop: "{{ bind_dns_chroot_dirs }}"

- name: Symlink var/run -> ../run dentro del chroot
  ansible.builtin.file:
    src: ../run
    dest: "{{ bind_dns_chroot_dir }}/var/run"
    state: link
    force: true

- name: Crear los puntos de montaje (directorios)  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ bind_dns_chroot_dir }}/{{ item.path }}"
    state: directory
  loop: "{{ bind_dns_chroot_mounts | selectattr('kind', 'equalto', 'dir') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Crear los puntos de montaje (archivos)  # noqa: risky-file-permissions
  ansible.builtin.copy:
    dest: "{{ bind_dns_chroot_dir }}/{{ item.path }}"
    content: ""
    force: false
  loop: "{{ bind_dns_chroot_mounts | selectattr('kind', 'equalto', 'file') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Montar (bind) los recursos dentro del chroot
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ bind_dns_chroot_dir }}/{{ item.path }}"
    fstype: none
    opts: bind,nofail
    state: mounted
  loop: "{{ bind_dns_chroot_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Recargar systemd tras editar /etc/fstab
  ansible.builtin.systemd:
    daemon_reload: true

- name: Crear el directorio etc/bind del chroot
  ansible.builtin.file:
    path: "{{ bind_dns_chroot_dir }}/etc/bind"
    state: directory
    owner: root
    group: bind
    mode: "2755"
  when: not bind_dns_etc_bind.stat.islnk | default(false)

- name: Copiar /etc/bind al chroot
  ansible.builtin.command: "cp -a /etc/bind/. {{ bind_dns_chroot_dir }}/etc/bind/"
  args:
    creates: "{{ bind_dns_chroot_dir }}/etc/bind/named.conf"
  when: not bind_dns_etc_bind.stat.islnk | default(false)

- name: Quitar el /etc/bind original
  ansible.builtin.file:
    path: /etc/bind
    state: absent
  when: not bind_dns_etc_bind.stat.islnk | default(false)

- name: /etc/bind como symlink al chroot
  ansible.builtin.file:
    src: ../var/lib/named/etc/bind
    dest: /etc/bind
    state: link
    force: true

- name: Configurar named con -t (chroot)
  ansible.builtin.lineinfile:
    path: /etc/default/named
    regexp: '^OPTIONS='
    line: 'OPTIONS="-u bind -t {{ bind_dns_chroot_dir }}"'
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar named

- name: AppArmor, permitir el chroot
  ansible.builtin.blockinfile:
    path: /etc/apparmor.d/local/usr.sbin.named
    create: true
    owner: root
    group: root
    mode: "0644"
    block: |
      {{ bind_dns_chroot_dir }}/etc/bind/** r,
      {{ bind_dns_chroot_dir }}/usr/share/dns/root.* r,
      {{ bind_dns_chroot_dir }}/{,var/}run/named/named.pid w,
      {{ bind_dns_chroot_dir }}/{,var/}run/named/session.key w,
  when: ansible_facts['apparmor']['status'] == 'enabled'
  notify: Recargar AppArmor

# --- configuracion ------------------------------------------------------------
- name: Configurar named.conf.options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
    validate: /usr/bin/named-checkconf %s
  notify: Reiniciar named

- name: Templar zona forward mco.local
  ansible.builtin.template:
    src: db.mco.local.j2
    dest: /var/lib/bind/db.mco.local
    owner: root
    group: bind
    mode: "0644"
  notify: Recargar zonas BIND

- name: Templar zona reversa 20.168.192.in-addr.arpa
  ansible.builtin.template:
    src: db.mco.local.inv.j2
    dest: /var/lib/bind/db.mco.local.inv
    owner: root
    group: bind
    mode: "0644"
  notify: Recargar zonas BIND

# --- homelab.local: zona dinámica (Ansible + ExternalDNS por RFC 2136) ---------------------------
- name: Leer de 1Password los secretos TSIG
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - scripts/read_onepassword_field.py
      - --item
      - "{{ bind_dns_tsig_op_item }}"
      - --field
      - "{{ item.field }}"
    chdir: "{{ playbook_dir }}"
  loop: "{{ bind_dns_tsig_keys }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  register: bind_dns_tsig_read
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true
  when: bind_dns_tsig_secrets is not defined

# El script nunca escribe el secreto en stderr: mostrar el motivo es seguro.
- name: Fallar con el motivo si no se pudo leer 1Password
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: "{{ bind_dns_tsig_op_item }}/{{ item.item.field }}: {{ item.stderr | default('') }}"
    quiet: true
  loop: "{{ bind_dns_tsig_read.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: bind_dns_tsig_secrets is not defined

- name: Guardar los secretos TSIG
  ansible.builtin.set_fact:
    bind_dns_tsig_secrets: "{{ dict(bind_dns_tsig_read.results | map(attribute='item.field') | zip(bind_dns_tsig_read.results | map(attribute='stdout'))) }}"
  no_log: true
  when: bind_dns_tsig_secrets is not defined

- name: Escribir las llaves TSIG
  ansible.builtin.template:
    src: tsig-key.j2
    dest: "/etc/bind/{{ item.name }}.key"
    owner: root
    group: bind
    mode: "0640"
  loop: "{{ bind_dns_tsig_keys }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Reiniciar named

# force: false: el archivo solo se crea la primera vez. Después lo mantiene BIND (cambios dinámicos y su
# diario .jnl): volver a templarlo borraría los registros de ExternalDNS. BIND (usuario bind) lo reescribe.
- name: Crear la zona homelab.local (solo la primera vez)
  ansible.builtin.template:
    src: db.homelab.local.j2
    dest: /var/lib/bind/db.homelab.local
    owner: bind
    group: bind
    mode: "0644"
    force: false

# Una zona que era estática (templada por versiones anteriores de este rol) tiene dueño root: BIND no
# podría reescribirla al volcar el diario.
- name: Dueño bind para la zona dinámica
  ansible.builtin.file:
    path: /var/lib/bind/db.homelab.local
    owner: bind
    group: bind

- name: Declarar las zonas en named.conf.local
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: Reiniciar named

# BIND tiene que aceptar ya los cambios dinámicos (update-policy) antes de nsupdate.
- name: Aplicar la configuración de BIND antes de escribir registros
  ansible.builtin.meta: flush_handlers

- name: Archivo de registros fijos (nsupdate)
  ansible.builtin.template:
    src: homelab-records.nsupdate.j2
    dest: /etc/bind/homelab-records.nsupdate
    owner: root
    group: bind
    mode: "0640"
  register: bind_dns_records_file

- name: Archivo de nombres a quitar (nsupdate)
  ansible.builtin.template:
    src: homelab-removals.nsupdate.j2
    dest: /etc/bind/homelab-removals.nsupdate
    owner: root
    group: bind
    mode: "0640"
  register: bind_dns_removals_file

# Antes que los fijos: un nombre que pasa de la lista de quitados a la de fijos queda escrito.
- name: Quitar de homelab.local los nombres que ya no escribe Ansible
  ansible.builtin.command: nsupdate -k /etc/bind/homelab-ansible.key /etc/bind/homelab-removals.nsupdate
  changed_when: true
  when:
    - bind_dns_removals_file is changed
    - bind_dns_removed_names | length > 0
    - not ansible_check_mode

# Solo cuando cambia la lista (o con -e bind_dns_force_records=true, si alguien borró un registro a mano).
- name: Escribir los registros fijos en homelab.local
  ansible.builtin.command: nsupdate -k /etc/bind/homelab-ansible.key /etc/bind/homelab-records.nsupdate
  changed_when: true
  when:
    - bind_dns_records_file is changed or (bind_dns_force_records | default(false) | bool)
    - not ansible_check_mode

- name: Habilitar named
  ansible.builtin.systemd:
    name: named
    enabled: true
    state: started
  when: not (ansible_check_mode and bind_dns_pkg is changed)
