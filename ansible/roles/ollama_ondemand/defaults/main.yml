---
# ollama_ondemand — valores por defecto. Ver README.md del rol.

# Versión fijada de Ollama (una sola para todos los nodos; el release publica un asset por arquitectura).
ollama_ondemand_version: "0.40.11"

# Assets oficiales por arquitectura (formato tar.zst, ~1,5 GB cada uno). La clave se elige con ansible_facts.architecture
# (x86_64 -> linux-amd64, aarch64 -> linux-arm64). "checksum" es el campo "digest" que GitHub publica para ese asset
# (API releases/tags/v<versión>). Al subir de versión hay que actualizar AMBOS checksums:
#   curl -s https://api.github.com/repos/ollama/ollama/releases/tags/v<versión>   # campo digest de cada asset ollama-linux-<arch>.tar.zst
# Se usan los assets base (CPU); los variantes -rocm, -mlx y -jetpack no aplican a estos nodos.
ollama_ondemand_assets:
  linux-arm64:
    name: ollama-linux-arm64.tar.zst
    checksum: "sha256:77b278837b9e62c172f77d703675be4c52c8054e9075639031a9a6d5a53f1924"
  linux-amd64:
    name: ollama-linux-amd64.tar.zst
    checksum: "sha256:7bedab90dd122661be78798e9f0edf37fccf0cccf2699d2c58ea1a3afdc04b6d"
# Arquitectura del nodo (ansible_facts.architecture) -> clave de ollama_ondemand_assets.
ollama_ondemand_arch_map:
  x86_64: linux-amd64
  aarch64: linux-arm64
  arm64: linux-arm64
ollama_ondemand_download_base: "https://github.com/ollama/ollama/releases/download/v{{ ollama_ondemand_version }}"

# Usuario del sistema y carpeta donde Ollama guarda los modelos.
ollama_ondemand_user: ollama
ollama_ondemand_home: /var/lib/ollama
# Carpeta de modelos (OLLAMA_MODELS). Es la misma que lee el agente de registro (manifests/ y manifests-v2/).
ollama_ondemand_models_dir: "{{ ollama_ondemand_home }}/.ollama/models"

# Dirección donde escucha el socket de systemd: SOLO la IP del nodo (no 0.0.0.0). Sin autenticación: el firewall
# del nodo (rol host_firewall) debe admitir únicamente a los nodos K3s.
ollama_ondemand_listen: "{{ static_ip }}:11434"

# Dirección interna de Ollama (solo loopback; el proxy conecta aquí).
ollama_ondemand_internal: "127.0.0.1:11435"

# Tiempo sin tráfico tras el cual el proxy sale (y con él se detiene Ollama).
ollama_ondemand_idle_time: 5m

# Cuánto mantiene Ollama un modelo cargado en RAM sin peticiones.
ollama_ondemand_keep_alive: 5m

# Tope de memoria de ollama.service (MemoryMax de systemd, p. ej. "5G" o "3500M"). Protege al nodo: si Ollama lo
# supera, el kernel lo mata a él y no al resto. Vacío = sin tope. Se fija por host en host_vars.
ollama_ondemand_memory_max: ""

# Tope de CPU de ollama.service (CPUQuota de systemd), en % del total de núcleos del nodo. Ollama nunca puede ocupar
# todo el nodo: queda aire para K3s, el DNS y el resto. 0 = sin tope.
ollama_ondemand_cpu_quota_percent: 75

# Guardia de CPU (ollama-cpu-guard): cada ollama_ondemand_cpu_guard_interval mide el uso de ollama.service; si pasa
# ollama_ondemand_cpu_guard_hours horas seguidas por encima de ollama_ondemand_cpu_guard_threshold (% del total de
# núcleos), detiene Ollama y su socket y lo publica en node-exporter (alerta OllamaDetenidoPorCPU). En el HomeLab
# ninguna carga legítima tiene a Ollama horas al tope: si pasa, algo está mal y alguien tiene que mirarlo.
ollama_ondemand_cpu_guard_enabled: true
ollama_ondemand_cpu_guard_threshold: 60
ollama_ondemand_cpu_guard_hours: 2
ollama_ondemand_cpu_guard_interval: 5min
# Carpeta del textfile collector de node-exporter (la misma que usan los roles node_*_metrics).
ollama_ondemand_textfile_dir: /var/lib/node_exporter/textfile

# Ruta de systemd-socket-proxyd. Se prueba esta y, si no existe, la alternativa (Debian usa /usr/lib/systemd
# o /lib/systemd según el empaquetado).
ollama_ondemand_proxyd_candidates:
  - /usr/lib/systemd/systemd-socket-proxyd
  - /lib/systemd/systemd-socket-proxyd

# Segundos máximos que espera ExecStartPost a que Ollama escuche en el arranque en frío.
ollama_ondemand_start_timeout: 60

# Modelos a descargar en ESTE nodo (tag "models"). Se define por host en host_vars; por defecto, ninguno.
ollama_ondemand_models: []
