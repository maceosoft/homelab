---
# Sin API no se puede instalar ArgoCD: mejor fallar aquí que saltarse el rol en silencio.
- name: Comprobar acceso kubectl en server
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_argocd_kubectl
  changed_when: false
  check_mode: false

- name: Crear namespace argocd
  ansible.builtin.command: k3s kubectl create namespace argocd
  register: k3s_argocd_ns
  failed_when: k3s_argocd_ns.rc != 0 and 'AlreadyExists' not in k3s_argocd_ns.stderr
  changed_when: k3s_argocd_ns.rc == 0

# version: latest -> la última versión estable de ArgoCD (archivo VERSION de la
# rama "stable" del repo oficial). Un tag fijo (p. ej. v3.5.3) la pisa.
- name: Resolver la versión de ArgoCD a instalar
  ansible.builtin.uri:
    url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/VERSION
    return_content: true
  register: k3s_argocd_stable
  when: k3s_install.gitops_argocd.version == 'latest'
  check_mode: false
  changed_when: false

- name: Fijar la versión de ArgoCD
  ansible.builtin.set_fact:
    k3s_argocd_version: >-
      {{ ('v' ~ (k3s_argocd_stable.content | trim))
         if k3s_install.gitops_argocd.version == 'latest'
         else k3s_install.gitops_argocd.version }}

# --server-side --force-conflicts: obligatorio desde ArgoCD 3.3, cuyo CRD de
# ApplicationSet supera el límite de anotación del apply normal.
# El apply server-side responde "serverside-applied" aunque no cambie nada: kubectl diff
# (rc 0 = igual, 1 = hay diferencias) decide si hace falta aplicar.
- name: Comparar ArgoCD con lo instalado ({{ k3s_argocd_version }})
  ansible.builtin.command: >-
    k3s kubectl diff -n argocd --server-side --force-conflicts
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ k3s_argocd_version }}/manifests/install.yaml
  register: k3s_argocd_diff
  changed_when: false
  failed_when: k3s_argocd_diff.rc > 1
  check_mode: false

- name: Instalar ArgoCD controller ({{ k3s_argocd_version }})
  ansible.builtin.command: >-
    k3s kubectl apply -n argocd --server-side --force-conflicts
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ k3s_argocd_version }}/manifests/install.yaml
  changed_when: true
  when: k3s_argocd_diff.rc == 1

- name: Esperar argocd-server Ready
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=available deployment/argocd-server
    -n argocd --timeout=300s
  changed_when: false
  when: not ansible_check_mode

- name: Recordar paso GitOps post-bootstrap
  ansible.builtin.debug:
    msg: >-
      ArgoCD {{ k3s_argocd_version }} listo. Aplica el ApplicationSet de bootstrap desde gitops:
      kubectl apply -f bootstrap/root-appset.yaml
      (repo: {{ k3s_install.gitops_argocd.gitops_repo_url }})
