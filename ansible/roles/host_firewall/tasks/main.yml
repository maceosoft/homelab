---
# host_firewall — nftables en tabla propia con aplicación segura (auto-reversión).
# Ver defaults/main.yml (diseño) y playbook-firewall.yml (orden de aplicación).

# --- Comprobaciones previas: no aplicar un firewall a ciegas ---------------------
- name: "Obtener la IP del cliente SSH (estación del operador)"
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  register: host_firewall_ssh_connection
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Recordar la IP del cliente SSH (solo IPv4)"
  ansible.builtin.set_fact:
    host_firewall_ssh_client_ip: >-
      {{ (host_firewall_ssh_connection.stdout.split()[0]
          if (host_firewall_ssh_connection.stdout | length > 0) else '') }}

- name: "Descartar el cliente SSH si no es una IPv4"
  ansible.builtin.set_fact:
    host_firewall_ssh_client_ip: ""
  when: host_firewall_ssh_client_ip is not regex('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')

- name: "Verificar: hay nodos, LAN y al menos un origen de operador"
  ansible.builtin.assert:
    that:
      - host_firewall_sets['nodes'] | length > 0
      - host_firewall_sets['lan'] | length > 0
      - host_firewall_sets['operator'] | length > 0
      - >-
        (host_firewall_services | map(attribute='from') | flatten | unique
         | difference(host_firewall_sets.keys() | list)) | length == 0
    fail_msg: >-
      Faltan datos para armar el firewall: sin IP de nodos, sin LAN, sin ningún origen de
      operador (defina host_firewall_operator_cidrs o conéctese por SSH desde la estación)
      o un servicio usa un conjunto 'from' que no existe en host_firewall_sets.
    success_msg: >-
      OK: operador={{ host_firewall_sets['operator'] | join(',') }}
      nodos={{ host_firewall_sets['nodes'] | join(',') }}

# --- Paquete y archivos fijos --------------------------------------------------------
- name: Instalar nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Comprobar que nft existe (en --check el paquete puede no estar instalado aún)"
  ansible.builtin.stat:
    path: "{{ host_firewall_nft_bin }}"
  register: host_firewall_nft_stat

- name: Directorio de las reglas
  ansible.builtin.file:
    path: "{{ host_firewall_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Script de reversión
  ansible.builtin.template:
    src: homelab-firewall-revert.sh.j2
    dest: "{{ host_firewall_revert_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Unidad systemd de reglas persistentes
  ansible.builtin.template:
    src: homelab-firewall.service.j2
    dest: /etc/systemd/system/homelab-firewall.service
    owner: root
    group: root
    mode: "0644"
  register: host_firewall_unit

- name: Recargar systemd si cambió la unidad  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: host_firewall_unit is changed

# --- Reglas: render y validación -------------------------------------------------------
- name: Renderizar el conjunto de reglas
  ansible.builtin.set_fact:
    host_firewall_ruleset: "{{ lookup('ansible.builtin.template', 'homelab_filter.nft.j2') }}"

- name: "Validar la sintaxis con nft -c (no carga nada)"
  ansible.builtin.command: "{{ host_firewall_nft_bin }} -c -f -"
  args:
    stdin: "{{ host_firewall_ruleset }}"
  changed_when: false
  check_mode: false
  when: host_firewall_nft_stat.stat.exists

- name: "Modo --check: mostrar el conjunto de reglas que se aplicaría"
  ansible.builtin.debug:
    msg: "{{ host_firewall_ruleset.splitlines() }}"
  when: ansible_check_mode

# --- Aplicación con confirmación -----------------------------------------------------------
- name: Aplicar con auto-reversión y confirmación
  ansible.builtin.include_tasks: apply.yml
  when: not ansible_check_mode
