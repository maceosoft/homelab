---
- name: Omitir CNI externo si Flannel embebido
  ansible.builtin.meta: end_host
  when: k3s_install.core.cni | default('flannel') == 'flannel'

- name: Etiqueta de espera según CNI
  ansible.builtin.set_fact:
    k3s_cni_wait_label: >-
      {{
        'k8s-app=canal' if k3s_install.core.cni == 'canal'
        else ('k8s-app=calico-node' if k3s_install.core.cni == 'calico'
        else 'k8s-app=cilium')
      }}
    k3s_cni_wait_namespace: >-
      {{ 'calico-system' if k3s_install.core.cni == 'calico' else 'kube-system' }}

- name: Comprobar API K3s
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_cni_api
  changed_when: false
  failed_when: false

- name: Fallar si el API no responde
  ansible.builtin.fail:
    msg: >-
      K3s API no disponible. Ejecuta el play del server antes del rol k3s_cni.
  when: k3s_cni_api.rc != 0

- name: Instalar Canal
  when: k3s_install.core.cni == 'canal'
  block:
    - name: Descargar manifest Canal
      ansible.builtin.get_url:
        url: "{{ k3s_cni_canal_manifest_url }}"
        dest: /tmp/canal.yaml
        mode: "0644"
      when: not ansible_check_mode

    - name: Aplicar Canal
      ansible.builtin.command: k3s kubectl apply -f /tmp/canal.yaml
      register: k3s_cni_canal_apply
      changed_when: "'created' in k3s_cni_canal_apply.stdout or 'configured' in k3s_cni_canal_apply.stdout"
      when: not ansible_check_mode

# Calico lo administra ArgoCD una vez adoptado (gitops: cni/calico-operator y cni/calico).
# Este rol solo hace el bootstrap (ArgoCD necesita red de pods para arrancar): si el
# Installation ya lo sigue ArgoCD, no se toca, para no pelear con él por la propiedad de los campos.
- name: Detectar si ArgoCD ya administra Calico
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - installation
      - default
      - -o
      - jsonpath={.metadata.annotations.argocd\.argoproj\.io/tracking-id}
  register: k3s_cni_calico_tracking
  changed_when: false
  failed_when: false
  when: k3s_install.core.cni == 'calico' and not ansible_check_mode

- name: Instalar Calico (CRDs + operator + custom resources)
  when:
    - k3s_install.core.cni == 'calico'
    - ansible_check_mode or (k3s_cni_calico_tracking.stdout | default('') | length == 0)
  block:
    # Desde Calico v3.31 los CRDs van aparte del operador.
    - name: Aplicar CRDs de Calico
      ansible.builtin.command: >-
        k3s kubectl apply --server-side --force-conflicts
        -f {{ k3s_cni_calico_crds_url }}
      register: k3s_cni_calico_crds
      changed_when: "'created' in k3s_cni_calico_crds.stdout or 'configured' in k3s_cni_calico_crds.stdout"
      when: not ansible_check_mode

    - name: Aplicar Tigera operator
      ansible.builtin.command: >-
        k3s kubectl apply --server-side --force-conflicts
        -f {{ k3s_cni_calico_operator_url }}
      register: k3s_cni_calico_op
      changed_when: "'created' in k3s_cni_calico_op.stdout or 'configured' in k3s_cni_calico_op.stdout"
      when: not ansible_check_mode

    - name: Renderizar custom resources Calico
      ansible.builtin.template:
        src: calico-custom-resources.yaml.j2
        dest: /tmp/calico-custom-resources.yaml
        mode: "0600"

    - name: Aplicar custom resources Calico
      ansible.builtin.command: >-
        k3s kubectl apply --server-side --force-conflicts
        -f /tmp/calico-custom-resources.yaml
      register: k3s_cni_calico_cr
      changed_when: "'created' in k3s_cni_calico_cr.stdout or 'configured' in k3s_cni_calico_cr.stdout"
      when: not ansible_check_mode

- name: Instalar Cilium (HelmChart del helm-controller de K3s)
  when: k3s_install.core.cni == 'cilium'
  block:
    - name: Renderizar HelmChart de Cilium
      ansible.builtin.template:
        src: cilium-helmchart.yaml.j2
        dest: /tmp/cilium-helmchart.yaml
        mode: "0600"

    - name: Aplicar Cilium
      ansible.builtin.command: k3s kubectl apply -f /tmp/cilium-helmchart.yaml
      register: k3s_cni_cilium_apply
      changed_when: "'created' in k3s_cni_cilium_apply.stdout or 'configured' in k3s_cni_cilium_apply.stdout"
      when: not ansible_check_mode

# Con el operador de Calico los pods tardan en existir y "kubectl wait" falla al instante si aún no hay
# ninguno: se reintenta, y si el CNI no queda listo en ~6 minutos el play falla (antes seguía igual).
- name: Esperar pods del CNI
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=ready pod
    -l {{ k3s_cni_wait_label }}
    -n {{ k3s_cni_wait_namespace }} --timeout=60s
  register: k3s_cni_wait
  changed_when: false
  retries: 5
  delay: 10
  until: k3s_cni_wait.rc == 0
  when: not ansible_check_mode
