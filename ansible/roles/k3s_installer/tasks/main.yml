---
# Descarga install.sh del tag de la versión fijada y verifica su SHA-256, en lugar de
# `curl | sh` sin verificar. Publica k3s_installer_path para los roles k3s_server y k3s_agent.
# (El propio install.sh verifica luego el hash del binario contra la release.)
- name: Exigir el checksum del instalador
  ansible.builtin.assert:
    that:
      - k3s_install.core.installer_sha256 | default('') | length == 64
    fail_msg: >-
      Falta k3s_install.core.installer_sha256 (SHA-256 de install.sh para {{ k3s_version }}).
      Ver el comentario en group_vars/incus_cluster/k3s_install.yml.
    quiet: true

- name: Crear el directorio del instalador
  ansible.builtin.file:
    path: /usr/local/lib/k3s-install
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Descargar install.sh de K3s con checksum
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
    dest: "/usr/local/lib/k3s-install/install-{{ k3s_version }}.sh"
    checksum: "sha256:{{ k3s_install.core.installer_sha256 }}"
    owner: root
    group: root
    mode: "0700"

- name: Publicar la ruta del instalador  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    k3s_installer_path: "/usr/local/lib/k3s-install/install-{{ k3s_version }}.sh"
