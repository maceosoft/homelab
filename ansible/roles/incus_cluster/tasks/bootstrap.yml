---
- name: Renderizar preseed bootstrap
  ansible.builtin.template:
    src: preseed-bootstrap.yml.j2
    dest: /tmp/incus-preseed-bootstrap.yml
    mode: "0600"
  when: not incus_cluster_node_clustered

- name: Bootstrap del clúster Incus (preseed)
  ansible.builtin.shell: |
    set -o pipefail
    cat /tmp/incus-preseed-bootstrap.yml | incus admin init --preseed
  args:
    executable: /bin/bash
  register: incus_cluster_bootstrap
  changed_when: incus_cluster_bootstrap.rc == 0
  when:
    - not incus_cluster_node_clustered
    - not ansible_check_mode

- name: Eliminar preseed bootstrap temporal
  ansible.builtin.file:
    path: /tmp/incus-preseed-bootstrap.yml
    state: absent
  when: not ansible_check_mode

- name: Esperar API Incus tras bootstrap
  ansible.builtin.wait_for:
    host: "{{ static_ip }}"
    port: 8443
    delay: 3
    timeout: 120
  when:
    - not incus_cluster_node_clustered
    - not ansible_check_mode
