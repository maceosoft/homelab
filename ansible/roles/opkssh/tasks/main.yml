---
# opkssh — SSH con identidad de Dex. Aditivo: no toca authorized_keys ni el
# drop-in 99-hardening.conf, así que la llave de emergencia sigue funcionando.

# opkssh valida cada login descargando las claves de Dex: si el host no resuelve el
# emisor, TODOS los logins fallan y el log solo dice "no such host". Se comprueba antes
# de instalar nada.
- name: Verificar que el host resuelve el emisor de Dex
  ansible.builtin.command: "getent hosts {{ opkssh_issuer | urlsplit('hostname') }}"
  register: opkssh_issuer_dns
  changed_when: false
  failed_when: false
  check_mode: false

- name: Abortar si el host no resuelve el emisor de Dex
  ansible.builtin.assert:
    that: opkssh_issuer_dns.rc == 0
    fail_msg: >-
      {{ inventory_hostname }} no resuelve {{ opkssh_issuer | urlsplit('hostname') }}. Sin eso,
      opkssh no puede validar ningún login. Revisa que /etc/resolv.conf use el BIND del
      HomeLab ({{ dns_primary }}) y que nada (p. ej. NetworkManager sin dns=none) lo reescriba:
      `cat /etc/resolv.conf` y `getent hosts {{ opkssh_issuer | urlsplit('hostname') }}`.
    quiet: true

- name: Usuario de sistema para el AuthorizedKeysCommand
  ansible.builtin.user:
    name: "{{ opkssh_system_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Descargar opkssh (versión fijada, checksum verificado)
  ansible.builtin.get_url:
    url: "{{ opkssh_download_base }}/opkssh-linux-{{ opkssh_arch }}"
    dest: "{{ opkssh_binary }}"
    checksum: "sha256:{{ opkssh_download_base }}/checksums.txt"
    owner: root
    group: root
    mode: "0755"

- name: Directorio /etc/opk
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ opkssh_system_user }}"
    mode: "0750"
  loop:
    - /etc/opk
    - /etc/opk/policy.d

# Solo Dex: no se heredan los proveedores por defecto (Google, Microsoft, ...).
- name: Proveedores OIDC permitidos
  ansible.builtin.copy:
    dest: /etc/opk/providers
    content: |
      # Issuer Client-ID expiration-policy
      {{ opkssh_issuer }} {{ opkssh_client_id }} {{ opkssh_key_expiration }}
    owner: root
    group: "{{ opkssh_system_user }}"
    mode: "0640"

# auth_id queda sin reglas: el acceso lo decide el policy plugin de abajo.
- name: Política estándar (sin reglas; el acceso lo decide el plugin)
  ansible.builtin.copy:
    dest: /etc/opk/auth_id
    content: |
      # Sin reglas a propósito. El acceso por grupo lo decide /etc/opk/policy.d/devops-team.yml
    owner: root
    group: "{{ opkssh_system_user }}"
    mode: "0640"

- name: Policy plugin - script que exige el grupo del team
  ansible.builtin.template:
    src: devops-team.sh.j2
    dest: /etc/opk/devops-team.sh
    owner: root
    group: "{{ opkssh_system_user }}"
    mode: "0755"

- name: Policy plugin - configuración
  ansible.builtin.template:
    src: devops-team.yml.j2
    dest: /etc/opk/policy.d/devops-team.yml
    owner: root
    group: "{{ opkssh_system_user }}"
    mode: "0640"

# Sin este archivo opkssh no registra por qué rechaza un login.
- name: Log de opkssh (legible por opksshuser)
  ansible.builtin.file:
    path: /var/log/opkssh.log
    state: touch
    modification_time: preserve
    access_time: preserve
    owner: root
    group: "{{ opkssh_system_user }}"
    mode: "0660"

- name: Archivo de configuración del servidor (puede estar vacío)
  ansible.builtin.copy:
    dest: /etc/opk/config.yml
    content: "---\n"
    force: false
    owner: root
    group: "{{ opkssh_system_user }}"
    mode: "0640"

# --- Cuenta compartida del team -----------------------------------------
- name: Cuenta Linux compartida del team
  ansible.builtin.user:
    name: "{{ opkssh_login_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Permitir sudo sin contraseña a la cuenta compartida (no tiene contraseña)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ opkssh_login_user }}"
    content: "{{ opkssh_login_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: opkssh_login_user_sudo_nopasswd

# --- CA del HomeLab: el host debe validar el certificado de Dex ---------
- name: Leer la CA del HomeLab desde cert-manager
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - cert-manager
      - get
      - secret
      - homelab-ca
      - -o
      - jsonpath={.data.ca\.crt}
  delegate_to: localhost
  become: false
  run_once: true
  register: opkssh_homelab_ca_b64
  changed_when: false
  check_mode: false
  no_log: true
  when: opkssh_install_homelab_ca

- name: Comprobar que lo leído es un certificado
  ansible.builtin.assert:
    that:
      - "'BEGIN CERTIFICATE' in (opkssh_homelab_ca_b64.stdout | b64decode)"
    fail_msg: "No se pudo leer ca.crt de cert-manager/homelab-ca (¿KUBECONFIG exportado?)"
    quiet: true
  when: opkssh_install_homelab_ca

- name: Instalar la CA del HomeLab
  ansible.builtin.copy:
    content: "{{ opkssh_homelab_ca_b64.stdout | b64decode }}"
    dest: /usr/local/share/ca-certificates/homelab-ca.crt
    owner: root
    group: root
    mode: "0644"
  register: opkssh_ca_installed
  when: opkssh_install_homelab_ca

- name: Actualizar el almacén de certificados
  ansible.builtin.command: update-ca-certificates
  changed_when: true
  when: opkssh_install_homelab_ca and opkssh_ca_installed is changed

# Solo se activa el AuthorizedKeysCommand si el host ya valida el certificado de Dex.
- name: Verificar que el host alcanza Dex y confía en su certificado
  ansible.builtin.uri:
    url: "{{ opkssh_issuer }}/.well-known/openid-configuration"
    status_code: 200
    return_content: false
  check_mode: false
  when: not ansible_check_mode or (opkssh_ca_installed | default({})) is not changed

# --- sshd -----------------------------------------------------------------
- name: Drop-in de sshd para opkssh
  ansible.builtin.template:
    src: 50-opkssh.conf.j2
    dest: /etc/ssh/sshd_config.d/50-opkssh.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify:
    - Validar sshd (opkssh)
    - Recargar sshd (opkssh)
