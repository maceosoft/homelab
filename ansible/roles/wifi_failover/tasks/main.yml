---
# WiFi de respaldo del cable, solo en nodos con hardware WiFi
# (has_wifi: true). NetworkManager se limita a la interfaz WiFi -- br0 y
# la NIC fisica quedan "unmanaged" para no competir con
# systemd-networkd/netplan, y dns=none para que no toque /etc/resolv.conf
# (mismo criterio que netplan_bridge, formalizado aqui para los hosts que
# tienen NetworkManager).

- name: Instalar NetworkManager
  ansible.builtin.apt:
    name: network-manager
    state: present
    update_cache: true

- name: Marcar br0 y la NIC fisica como unmanaged para NetworkManager
  ansible.builtin.template:
    src: unmanaged.conf.j2
    dest: /etc/NetworkManager/conf.d/unmanaged-netplan.conf
    owner: root
    group: root
    mode: "0644"
  register: wifi_failover_nm_unmanaged

- name: Configurar NetworkManager sin gestion de DNS
  ansible.builtin.template:
    src: dns-none.conf.j2
    dest: /etc/NetworkManager/conf.d/dns-none.conf
    owner: root
    group: root
    mode: "0644"
  register: wifi_failover_nm_dns_none

- name: Reiniciar NetworkManager si cambio alguna config
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
    enabled: true
  when: wifi_failover_nm_unmanaged is changed or wifi_failover_nm_dns_none is changed

- name: Verificar si el perfil wifi de respaldo ya existe
  ansible.builtin.command: "nmcli -t -f NAME connection show"
  register: wifi_failover_nm_connections
  changed_when: false

- name: Crear perfil de conexion wifi de respaldo (metrica mas alta que el cable)
  ansible.builtin.command: >-
    nmcli connection add type wifi con-name homelab-backup
    ifname {{ wifi_iface }} ssid {{ wifi_ssid }}
    wifi-sec.key-mgmt wpa-psk wifi-sec.psk {{ wifi_psk }}
    connection.autoconnect yes
    ipv4.route-metric 700 ipv6.route-metric 700
  when: "'homelab-backup' not in wifi_failover_nm_connections.stdout_lines"
  no_log: true
  changed_when: true
