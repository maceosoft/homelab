---
# SSH a los hosts con identidad de Dex (opkssh). Ver roles/opkssh/README.md.
#
# Aditivo y reversible: no toca authorized_keys ni el hardening. Aplicar
# primero en UN host (piloto) y probar el login antes de extender:
#
#   export KUBECONFIG=~/.kube/homelab-k3s.yaml   # para leer la CA de cert-manager
#   ansible-playbook -i inventory.ini playbook-opkssh.yml --limit oliver --check --diff
#   ansible-playbook -i inventory.ini playbook-opkssh.yml --limit oliver
#
# Quién entra lo decide el grupo de GitHub (maceosoft:devops) que Dex pone en el
# token: no hay listas de usuarios ni de emails que mantener.
#
# Requiere el cliente "opkssh" en Dex (maceosoft/gitops, argocd/config/dex.config)
# ya desplegado por ArgoCD.

- name: SSH con identidad de Dex (opkssh)
  hosts: incus_cluster
  become: true
  roles:
    - opkssh
