# Los hostnames siguen la serie Invincible:
# https://invincible.fandom.com/es/wiki/Categor%C3%ADa:Personajes
#
# ansible_host  = IP ACTUAL de conexion SSH (ajustar si cambia por DHCP).
# static_ip     = IP fija destino en br0 (playbook-set-static-ip.yml).
# ip_static y k3s_role viven en host_vars/<nodo>.yml (k3s_role cambia con la mudanza del control plane).
# bridge_iface  = interfaz fisica (confirmar con `ip -br link`).
[x86_nodes]
invincible ansible_host=192.168.20.6 static_ip=192.168.20.6 bridge_iface=eno2
oliver      ansible_host=192.168.20.7 static_ip=192.168.20.7 bridge_iface=eno1

[arm64_nodes]
deborah ansible_host=192.168.20.5 static_ip=192.168.20.5 bridge_iface=enP4p65s0

[incus_cluster:children]
x86_nodes
arm64_nodes

# Rol K3s por nodo, explícito (no por arquitectura): un nodo ARM64 o x86
# nuevo es agent salvo que se lo agregue a k3s_server a propósito.
# MUDANZA DEL CONTROL-PLANE (playbook-k3s-move-controlplane.yml): este grupo NO se cambia
# antes ni durante la mudanza. Al terminar, a mano: deborah pasa a [k3s_agent], oliver a
# [k3s_server], y en group_vars/all.yml k3s_api_ip=192.168.20.7 y k3s_move_done=true.
[k3s_server]
deborah

[k3s_agent]
invincible
oliver

# Nodos que corren Ollama bajo demanda (playbook-ollama.yml).
[llm_nodes]
deborah
invincible
oliver
